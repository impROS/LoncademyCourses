<script>
window.QUIZ = {
  id: "final-1",
  code: "Final · Genel Sınav 1",
  title: "Kafka Advanced — 60 soru / 90 dakika",
  back: "cheatsheet.md",
  backLabel: "Cheatsheet'e dön",
  mode: "exam",
  time: 5400,
  pass: 80,
  passNote: "hedef %80; %70 altı ilgili konuları tekrar et",
  notes: [
    "Alan dağılımı setin ağırlıklarıyla aynı: Broker 11 · Producer 9 · Consumer 9 · EOS 5 · Operasyon 11 · Streams 9 · Connect 5 · Genel 1.",
    "Sonuç ekranındaki zayıf alan raporundaki konu kodları doğrudan ilgili dosyaya işaret eder."
  ],
  questions: [
    { topic: "00.1 Genel bakış", q: "Kafka'nın klasik mesaj kuyruklarından temel farkı nedir?", opts: ["Tüketim yıkıcı değildir; mesaj retention süresince kalır ve birden çok grup bağımsız okuyabilir","Mesajlar tüketildikten sonra silinir","Sıra garantisi topic düzeyindedir","Consumer sayısı sınırsızdır"], a: [0], why: "Kafka <b>append-only bir log</b>tur: tüketmek offset ilerletmektir, silmek değil. Silme işini retention yapar (1.4). Sıra <b>partition</b> içindedir ve klasik grupta tüketici tavanı partition sayısıdır." },

    { topic: "1.1 Log segment", q: "<code>segment.bytes=1GB</code> ayarlı bir topic'te segmentler 120 MB'de dönüyor. En olası sebep nedir?", opts: ["segment.index.bytes doluyor; 12 baytlık time index girdileri offset index'ten önce doluyor","retention.ms segmenti kapatıyor","Compaction segmenti bölüyor","min.insync.replicas segment boyutunu sınırlıyor"], a: [0], why: "Segment <b>dört limitten ilk dolanla</b> döner: <code>segment.bytes</code>, <code>segment.ms</code>, offset index, time index. Time index girdisi 12 bayt (offset index 8) olduğu için küçük kayıtlarda genelde <b>time index</b> önce dolar." },
    { topic: "1.1 Log segment", q: "Kafka'nın <code>.index</code> dosyası seyrektir. Bir offset ararken izlenen sıra nedir?", opts: ["Dosya adlarında ikili arama → index'te ikili arama → log'da kısa ileri tarama","Tüm segmentleri baştan tarama","Index'ten doğrudan tam konum okuma","Broker'ın bellek içi haritasından okuma"], a: [0], why: "Dosya adı base offset'tir; index <code>index.interval.bytes</code> (4096) kadar veride bir girdi tutar, kalan mesafe log üzerinde ileri taranır." },
    { topic: "1.2 Replikasyon", q: "replication.factor=5, min.insync.replicas=3 bir topic'te acks=all ile kaç broker kaybına kadar <b>yazma devam eder</b>?", opts: ["2","3","4","1"], a: [0], why: "<b>replication.factor − min.insync.replicas</b> = 5−3 = 2. Üçüncü kayıpta yazma <code>NotEnoughReplicas</code> ile reddedilir ama okuma sürer ve veri kaybolmaz." },
    { topic: "1.2 Replikasyon", q: "Lider LEO=100, follower A LEO=98, follower B LEO=95 (üçü de ISR'de). Consumer en fazla hangi offset'e kadar okuyabilir?", opts: ["94","95","97","99"], a: [0], why: "High Watermark = ISR'in ortak asgarisi = 95; consumer <b>HW'nin altındaki</b> offsetleri görür, yani en fazla 94. HW üstü kayıtlar commit edilmemiştir." },
    { topic: "1.2 Replikasyon", q: "Bir follower'ın ISR'den düşmesinin tek kriteri nedir?", opts: ["replica.lag.time.max.ms (30 s) içinde liderin log sonuna yetişememek","Belirli sayıda mesaj geride kalmak","Farklı rack'te olmak","Disk doluluğunun %80'i geçmesi"], a: [0], why: "Mesaj sayısına dayalı eski kriter (<code>replica.lag.max.messages</code>) kaldırıldı; ani trafik artışlarında sağlıklı replikaları da düşürüyordu. Bugün tek ölçüt <b>süredir</b>." },
    { topic: "1.2 Replikasyon", q: "Eligible Leader Replicas (ELR) hakkında hangileri doğrudur? (İki doğru cevap — Choose TWO.)", opts: ["Kafka 4.1'den itibaren varsayılan olarak etkindir ve yalnızca KRaft'ta çalışır","ISR'den düşmüş ama verisi güvenilir replikaları izler","Fazladan bir veri kopyası oluşturur","Unclean leader election'ın yerine geçer ve veri kaybını imkânsız kılar"], a: [0,1], why: "ELR bir <b>muhasebe kaydıdır</b>: yeni kopya oluşturmaz, yalnızca \"kim güvenle lider olabilir\" bilgisini tutar. Kötü yapılandırmayı (min.insync.replicas=1 gibi) kurtarmaz." },
    { topic: "1.3 KRaft", q: "3 node'lu combined mod bir cluster'da 2 node çöktü. Hangisi doğrudur?", opts: ["Metadata yazan işlemler durur; kalan broker önbellekteki metadata ile bazı istekleri yanıtlamayı sürdürebilir","Cluster tamamen kapanır","Kalan node tek node'lu quorum'a geçer","Controller otomatik olarak yeni voter ekler"], a: [0], why: "Raft <b>kesin çoğunluk</b> ister (3 voter → 2). Çoğunluk kaybolunca <code>createTopics</code> gibi metadata yazmaları durur; veri istekleri bir süre sürebilir." },
    { topic: "1.3 KRaft", q: "Controller lideri olan node öldürülüp geri başlatıldı ama liderlik ona dönmedi. Bu ne demektir?", opts: ["Normaldir — Raft'ta preferred leader kavramı yoktur","Quorum bozulmuştur","auto.leader.rebalance.enable kapalıdır","Node metadata'sını kaybetmiştir"], a: [0], why: "<code>auto.leader.rebalance</code> <b>veri partition'ları</b> içindir; Raft quorum'unda liderliğin hangi voter'da olduğu önemsizdir." },
    { topic: "1.4 Retention", q: "12 partition'lı bir topic'e <code>retention.bytes=5GB</code> verildi. replication.factor=3 ile cluster genelinde azami disk kullanımı nedir?", opts: ["Yaklaşık 180 GB","5 GB","60 GB","15 GB"], a: [0], why: "<code>retention.bytes</code> <b>partition başına ve replika başına</b>dır: 12 × 5 GB = 60 GB tek kopya, replication.factor=3 ile 180 GB." },
    { topic: "1.4 Retention", q: "Compacted bir topic'te bir key'i silmek için ne yapılır ve kayıt ne kadar yaşar?", opts: ["value=null (tombstone) gönderilir; tombstone delete.retention.ms (24 saat) kadar kalır","deleteRecords çağrılır; kayıt anında silinir","Boş string gönderilir; retention.ms kadar kalır","Topic silinip yeniden oluşturulur"], a: [0], why: "Tombstone'un bir süre yaşaması, geride kalan tüketicilerin silme bilgisini görebilmesi içindir. TTL, tüketicinin azami gecikmesinden kısa olmamalıdır." },
    { topic: "1.5 Tiered storage", q: "<code>retention.ms=30 gün</code>, <code>local.retention.ms=1 gün</code> ne anlama gelir?", opts: ["Toplam 30 gün saklanır; son 1 gün broker diskinde, gerisi uzak depoda","31 gün saklanır","1 gün sonra veri silinir","30 gün sonra veri uzak depoya taşınır"], a: [0], why: "Yerel retention toplamın <b>alt kümesidir</b>; süreler toplanmaz. Taşıma segment kapanır kapanmaz başlar." },

    { topic: "2.1 Batching", q: "200 partition'a yazan bir producer'da <code>batch.size=64KB</code>. buffer.memory için asgari makul değer nedir?", opts: ["200 × 64 KiB ≈ 13 MiB'ın belirgin üstünde","64 KiB","32 MiB her durumda yeterlidir","Partition sayısının etkisi yoktur"], a: [0], why: "<code>batch.size</code> <b>partition başınadır</b>; producer her partition için ayrı batch tutar. Tampon yetersizse <code>send()</code> bloklar." },
    { topic: "2.1 Batching", q: "Key'i null olan kayıtlar hangi stratejiyle dağıtılır?", opts: ["Sticky partitioning — batch dolana kadar aynı partition, sonra değişir","Kayıt başına round-robin","Her zaman partition 0","Rastgele, kayıt başına"], a: [0], why: "Eski round-robin her batch'i tek kayıtlık bırakıyordu; sticky partitioning batch'leri doldurur ve dağılımı yine dengeler." },
    { topic: "2.2 Idempotence", q: "Broker idempotent bir producer'dan <code>sequence = son + 2</code> olan batch aldı. Ne yapar?", opts: ["OutOfOrderSequenceException döner — arada kayıp batch var","Batch'i yazar ve boşluk bırakır","Duplicate sayıp atar","Producer'dan yeniden gönderim ister"], a: [0], why: "Kural: <code>==son+1</code> yaz, <code>&lt;=son</code> duplicate at, <code>&gt;son+1</code> boşluk → ölümcül hata. Producer yeniden oluşturulmalı ve kayıp araştırılmalıdır." },
    { topic: "2.2 Idempotence", q: "enable.idempotence=true iken hangi ayar client tarafında <b>reddedilir</b>?", opts: ["retries=0","linger.ms=100","compression.type=zstd","batch.size=65536"], a: [0], why: "Idempotence üç şart dayatır: <code>acks=all</code>, <code>retries&gt;0</code>, <code>max.in.flight&le;5</code>. İhlalde producer <b>hiç oluşturulamaz</b>." },
    { topic: "2.3 Teslimat", q: "Producer callback'ine istisna ile ulaşan bir kayıt hakkında hangisi doğrudur?", opts: ["Client delivery.timeout.ms boyunca denemiştir; bu noktada hata kalıcıdır","İstisna geçiciyse client tekrar deneyecektir","Yalnızca kalıcı istisna tipleri callback'e ulaşır","Kayıt otomatik olarak DLQ'ya yazılır"], a: [0], why: "Retry mekanizması callback'ten <b>önce</b> çalışır. Oraya yalnızca log yazmak <b>veri kaybıdır</b>; kalıcı bir yere yaz ve metrik üret." },
    { topic: "2.3 Teslimat", q: "Hangi hata <code>send()</code> çağrısında <b>senkron</b> fırlatılır?", opts: ["SerializationException","NotEnoughReplicasException","NotLeaderOrFollowerException","Broker cevap vermediğinde oluşan TimeoutException"], a: [0], why: "Serileştirme uygulama thread'inde, kayıt tampona konmadan önce yapılır. Broker kaynaklı hatalar callback'e gelir. Sadece callback yazan kod serileştirme hatasını kaçırır." },
    { topic: "2.3 Teslimat", q: "acks=all ile p50 gecikme 4,3 ms, p99 29 ms; acks=1 ile p50 3,9 ms, p99 7 ms ölçüldü. Doğru yorum nedir?", opts: ["Dayanıklılığın bedeli medyanda küçük, kuyrukta büyüktür — en yavaş ISR üyesi beklenir","acks=all her istekte 4 kat yavaştır","Ölçüm hatalıdır","acks=1 her durumda tercih edilmelidir"], a: [0], why: "Replikasyon en yavaş ISR üyesini beklemektir; bu, kuyruk (tail) gecikmesine yansır. Karar p99 ile verilir ama p50 farkı çoğu zaman ihmal edilebilir." },
    { topic: "2.4 Şema", q: "Varsayılanı olmayan zorunlu bir alan eklemek hangi uyumluluğu kırar ve dağıtım sırası ne olmalıdır?", opts: ["BACKWARD kırılır; önce tüm consumer'lar, sonra producer güncellenmeli","FORWARD kırılır; önce producer güncellenmeli","Hiçbiri kırılmaz","FULL kırılır; değişiklik yapılamaz"], a: [0], why: "BACKWARD = yeni veriyi <b>eski okuyucu</b> okuyabilmeli. Varsayılansız alan bunu kırar; önce consumer'lar yeni şemayı öğrenmelidir." },
    { topic: "2.4 Şema", q: "Deserializer bir kayıtta istisna fırlattı. Consumer'ın position'ı ne olur?", opts: ["İlerlemez; aynı kayıt her poll'da yeniden denenir (zehirli kayıt)","Bir sonrakine ilerler","Rebalance tetiklenir","Kayıt otomatik atlanır"], a: [0], why: "Deserialization <code>poll()</code> içinde, offset ilerletilmeden yapılır. Kafka'nın hata mesajı bile çözümü söyler: \"seek past the record\"." },

    { topic: "3.1 Fetch/poll", q: "Kayıt başına işleme 500 ms sürüyor ve max.poll.interval.ms varsayılanda. max.poll.records için makul üst sınır nedir?", opts: ["600'ün belirgin altında; güvenlik payıyla 100-200","600 tam olarak doğrudur","500 varsayılanı güvenlidir","Sınır yoktur"], a: [0], why: "300.000/500 = 600 <b>teorik tavandır</b>; GC duraklaması ya da yavaş bir kayıt döngüyü kırar. Varsayılan 500 bu senaryoda 250 saniye eder — tehlikeli." },
    { topic: "3.1 Fetch/poll", q: "<code>fetch.min.bytes</code> hangi senaryoda kazandırır?", opts: ["Seyrek trafikte — boş fetch turlarını ve broker CPU'sunu azaltır","Dolu bir log'u baştan okurken","Her durumda","Yalnızca compacted topic'lerde"], a: [0], why: "Veri zaten hazırsa asgari bayt şartı yalnızca bekleme ekler; lab'da geriden okumada throughput'u %40 düşürdü." },
    { topic: "3.2 Rebalance", q: "Consumer 6 dakikalık bir işlemeye takıldı ama süreç yaşıyor ve heartbeat gidiyor. Hangi zamanlayıcı onu gruptan atar?", opts: ["max.poll.interval.ms","session.timeout.ms","heartbeat.interval.ms","request.timeout.ms"], a: [0], why: "Klasik protokolde heartbeat'i arka plan thread'i gönderir; takılmayı yakalayan <code>max.poll.interval.ms</code>'tir. <b>session = yaşıyor mu, max.poll.interval = ilerliyor mu.</b>" },
    { topic: "3.2 Rebalance", q: "Kafka 4.x'te KIP-848 protokolünü kullanmak için ne gerekir?", opts: ["Client'ta group.protocol=consumer ayarlamak","Hiçbir şey; otomatik etkindir","Broker'da rebalance.protocols değiştirmek","Tüm consumer'ları CooperativeSticky'ye geçirmek"], a: [0], why: "Broker tarafı varsayılan destekler ama <b>client varsayılanı hâlâ classic</b>'tir. Yeni protokol bir opt-in'dir." },
    { topic: "3.2 Rebalance", q: "Bir broker çöktü, 30 grubun yalnızca 6'sı etkilendi. Neden?", opts: ["Koordinatör hash(group.id)%50 ile seçilen offset partition'ının lideridir; yalnızca o broker'da koordinatörü olanlar etkilenir","Yalnızca o broker'dan okuyanlar etkilenir","Static membership kullanmayanlar etkilenir","Rastgeledir"], a: [0], why: "Grubun koordinatörü, tükettiği topic'in liderlerinden bağımsızdır — bu ayrım \"neden sadece bazıları\" sorusunun cevabıdır." },
    { topic: "3.3 Offset", q: "Offset 0-49 arası işlendi. Commit edilecek değer nedir?", opts: ["50","49","0","İşlenen sayı olarak 50 ama offset 49"], a: [0], why: "Commit <b>bir sonraki okunacak</b> offset'tir: <code>record.offset() + 1</code>. Eksik +1 her restart'ta son kaydı tekrarlatır." },
    { topic: "3.3 Offset", q: "Kayıtları thread pool'a atıp hemen sonraki poll'a geçen ve enable.auto.commit=true olan bir uygulamanın riski nedir?", opts: ["Kafka kayıtları işlenmiş sayar; işleme sırasında çöküşte veri kaybolur","Thread pool dolunca rebalance olur","Otomatik commit thread-safe değildir","Risk yoktur"], a: [0], why: "Otomatik commit <code>poll()</code> içinde, önceki poll'un kayıtları için yapılır ve işin bitip bitmediğini bilmez — bu tam olarak <b>önce commit</b> desenidir." },
    { topic: "3.4 Share group", q: "4 partition'lı bir topic'i 50 worker ile işlemek istiyorsun; her mesaj uzun süren bağımsız bir iş ve sıra önemsiz. Hangi model?", opts: ["Share group — tüketici sayısı partition sayısıyla sınırlı değildir","Consumer group, partition'ı 50'ye çıkararak","Consumer group, 4 worker yeterli","Kafka Streams"], a: [0], why: "Share group'ta atama birimi kayıttır. Partition artırmak da bir yol ama key→partition eşlemesini bozar ve broker maliyetini artırır." },
    { topic: "3.4 Share group", q: "Bir kayıt 5 kez teslim edilip hiç ACCEPT edilmedi. Varsayılanda ne olur?", opts: ["Arşivlenir — group.share.delivery.count.limit=5 aşıldı, bir daha teslim edilmez","Sonsuza kadar yeniden teslim edilir","Log'dan silinir","Otomatik DLQ'ya yazılır"], a: [0], why: "Bu limit, zehirli kayda karşı <b>yerleşik güvenlik ağıdır</b>; klasik consumer group'ta böyle bir koruma yoktur." },

    { topic: "4.1 Transactions", q: "3 kayıt commit, 3 kayıt abort edildi. read_uncommitted ve read_committed tüketiciler kaç kayıt görür?", opts: ["6 ve 3","3 ve 3","6 ve 6","3 ve 6"], a: [0], why: "Abort <b>silmez, filtreler</b>: kayıtlar log'da kalır. <code>read_uncommitted</code> hepsini görür; <code>read_committed</code> abort edilenleri <code>.txnindex</code> bilgisiyle atlar." },
    { topic: "4.1 Transactions", q: "EOS tüket-işle-yaz döngüsünde offset'i kim commit eder?", opts: ["Producer — sendOffsetsToTransaction ile transaction'ın parçası olarak","Consumer — commitSync ile","Broker otomatik","Consumer, enable.auto.commit=true ile"], a: [0], why: "Offsetin atomikliğe dahil olması için transaction'ın içinde yazılması gerekir; bu yüzden tüketicide <code>enable.auto.commit=false</code> zorunludur." },
    { topic: "4.1 Transactions", q: "read_committed bir tüketici ilerlemiyor; broker sağlıklı, rebalance yok, zehirli kayıt yok. Hipotez nedir?", opts: ["O partition'da açık bir transaction var; LSO ilerlemiyor","Compaction sürüyor","Partition offline","auto.offset.reset yanlış"], a: [0], why: "read_committed okuyucular <b>Last Stable Offset</b>'e kadar okur; açık bir transaction LSO'yu dondurur. <code>transaction.timeout.ms</code> (60 s) dolunca çözülür." },
    { topic: "4.1 Transactions", q: "ProducerFencedException alındığında doğru davranış nedir?", opts: ["Producer kapatılmalı; retry edilmemeli — ölümcül bir hatadır","abortTransaction çağrılıp devam edilmeli","Yeni bir transaction başlatılmalı","Yok sayılmalı"], a: [0], why: "Aynı <code>transactional.id</code> ile yeni bir producer başladığında eski oturum fence'lenir. Fenced producer'ı kullanmaya devam etmek veri bozar." },
    { topic: "4.2 Outbox", q: "<code>@Transactional</code> içinde önce DB'ye kaydedip sonra Kafka'ya gönderen kodun problemi nedir?", opts: ["DB transaction'ı Kafka'yı kapsamaz; iki sistem arasında atomiklik yoktur (dual write)","send asenkron olduğu için sıra bozulur","Transaction içinde send çağrılamaz","Problem yoktur"], a: [0], why: "Rollback gönderilmiş mesajı geri almaz; Kafka'ya gitmeyen mesaj da kaybolur. Çözüm <b>outbox</b> desenidir." },

    { topic: "5.1 Tuning", q: "Doygun bir sistemde linger.ms 0'dan 50'ye çıkarıldığında p99 gecikme 1201 ms'den 91 ms'ye düştü. Açıklaması nedir?", opts: ["Batch'siz producer istek sayısını patlatıyordu; gecikme broker kuyruğundan geliyordu","linger.ms gecikmeyi hiçbir zaman artırmaz","Sıkıştırma ağ gecikmesini sıfırladı","Ölçüm hatalıdır"], a: [0], why: "Batch'leme istek sayısını düşürüp kuyruğu eritti. <b>Ama bu evrensel değildir</b>: boş bir sistemde linger doğrudan gecikme ekler." },
    { topic: "5.1 Tuning", q: "Broker'lara 32 GB heap vermenin sonucu nedir?", opts: ["GC duraklamaları uzar; ISR'den düşme ve rebalance riski artar","Okuma hızlanır","Replikasyon hızlanır","Etkisi yoktur"], a: [0], why: "Kafka veriyi heap'te tutmaz; page cache kullanır. Büyük heap yalnızca GC maliyeti getirir — pratik öneri ~6 GB." },
    { topic: "5.2 Metrikler", q: "UnderReplicatedPartitions ile UnderMinIsrPartitionCount arasındaki aciliyet farkı nedir?", opts: ["UnderMinIsr > 0 ise acks=all yazmalar reddediliyordur — üretim durmuştur","İkisi aynıdır","UnderReplicated daha kritiktir","UnderMinIsr yalnızca compacted topic'lerde anlamlıdır"], a: [0], why: "İlki dayanıklılık düşüşü, ikincisi <b>fiili kesinti</b>dir." },
    { topic: "5.2 Metrikler", q: "ActiveControllerCount üç broker'da 0, 1, 0 dönüyor. Durum nedir?", opts: ["Sağlıklı — cluster toplamı tam olarak 1 olmalıdır","Sorunlu, hepsi 1 dönmeli","Sorunlu, controller seçimi tamamlanmamış","Metrik yalnızca controller'da okunabilir"], a: [0], why: "Metrik broker başına okunur; yalnızca aktif controller 1 döner. Alarm <b>cluster toplamı</b> üzerine kurulur." },
    { topic: "5.2 Metrikler", q: "Produce isteklerinde TotalTimeMs yüksek ve büyük kısmı RemoteTimeMs. Sorun nerededir?", opts: ["Follower'larda — acks=all replikasyon onayı bekleniyor","Yerel diskte","İstek kuyruğunda","Producer'da"], a: [0], why: "Bileşen ayrımı teşhisi hızlandırır: RequestQueue (kuyruk) · Local (disk) · <b>Remote (replikasyon)</b> · Response (ağ)." },
    { topic: "5.3 Arıza", q: "<code>Leader: none, Isr: , Elr: 3</code> gördün. İlk yapman gereken nedir?", opts: ["3 numaralı broker'ı geri getirmek","unclean.leader.election.enable=true yapmak","Topic'i yeniden oluşturmak","Partition sayısını artırmak"], a: [0], why: "ELR verinin 3'te güvenli olduğunu söylüyor; broker dönerse partition <b>kayıpsız</b> açılır. Unclean seçim son çaredir ve veri kaybıdır." },
    { topic: "5.3 Arıza", q: "Broker diski %98 dolu. Doğru müdahale nedir?", opts: ["Büyük topic'lerde retention.ms ve segment.ms düşürüp temizliği broker'a yaptırmak","En eski .log dosyalarını elle silmek","Broker'ı formatlamak","Consumer'ları durdurmak"], a: [0], why: "Elle silmek index/checkpoint tutarlılığını bozar. <code>segment.ms</code> de gerekir çünkü <b>aktif segment silinmez</b>." },
    { topic: "5.4 Güvenlik", q: "Tüketiciye Topic:Read ve Topic:Describe verildi ama çalışmıyor. Hangi hata ve hangi eksik?", opts: ["GroupAuthorizationException — Group:Read eksik","TopicAuthorizationException — Topic:Write eksik","ClusterAuthorizationException — Cluster:Describe eksik","SaslAuthenticationException"], a: [0], why: "Tüketici üç ACL ister; <b>Group:Read</b> en sık unutulanıdır ve hata mesajı topic değil <b>grup</b> hakkındadır." },
