  notes: [

  ],
  questions: [
    { topic: "00.1 Genel bakış", q: "8 partition'lı bir topic'i 20 consumer'lı tek bir klasik grupla tüketiyorsun. Throughput neden artmadı?", opts: ["8 consumer partition alır, 12'si atıl bekler","20 consumer 8 partition'ı zaman paylaşımıyla böler","Broker fazla consumer'ı reddeder","Her consumer tüm partition'ları okur"], a: [0], why: "Klasik grupta bir partition aynı anda tek consumer'a atanır. Broker fazlasını <b>reddetmez, sessizce atıl bırakır</b> — tuzağın tehlikesi budur. Share group (3.4) bu tavanı kaldırır." },

    { topic: "1.1 Log segment", q: "Günde 5 mesaj alan bir topic'te retention.ms=1 saat olmasına rağmen aylık veri duruyor. Doğru çözüm nedir?", opts: ["segment.ms değerini düşürmek","log.cleaner.enable=true yapmak","cleanup.policy=compact yapmak","retention.check.interval.ms'i 1 saniyeye çekmek"], a: [0], why: "Retention segment düzeyinde çalışır ve <b>aktif segment silinmez</b>; trafik azsa segment hiç dönmez. KIP-1030 sonrası <code>segment.ms</code> alt sınırı 1 dakikadır." },
    { topic: "1.1 Log segment", q: "802 baytlık bir değer dump çıktısında <code>size: 877</code> görünüyor. Aradaki 75 bayt nedir?", opts: ["Record batch başlığı ve kayıt metadata'sı (producerId, sequence, CRC, timestamp, key boyutu)","Replikasyon kontrol toplamı","Sıkıştırma sözlüğü","Page cache hizalama dolgusu"], a: [0], why: "Küçük mesajlarda bu sabit maliyet oransal olarak büyür; batch'lemek yalnızca hız değil <b>disk ve ağ</b> kazandırır." },
    { topic: "1.1 Log segment", q: "Broker restart'ı 20 dakika sürüyor ve log dizininde on binlerce segment var. Sebep nedir?", opts: ["Açılışta her segmentin index'i açılıp doğrulanıyor; segment sayısı çok fazla","Broker tüm veriyi diğerlerinden yeniden çekiyor","Page cache ısınana kadar istek kabul edilmiyor","Consumer offsetleri yeniden hesaplanıyor"], a: [0], why: "Çok küçük <code>segment.bytes</code>/<code>segment.index.bytes</code> ya da aşırı partition sayısı açılış süresini doğrusal büyütür." },
    { topic: "1.2 Replikasyon", q: "replication.factor=2 ve min.insync.replicas=2 yapılandırması neden üretimde önerilmez?", opts: ["Tek broker bakımı bile yazmayı durdurur; kayıp toleransı sıfırdır","Kafka bu kombinasyonu reddeder","min.insync replication.factor'ten küçük olmak zorundadır","replication.factor=2'de ISR çalışmaz"], a: [0], why: "replication.factor−min.insync.replicas = 0. Üretim standardı <b>replication.factor=3 + min.insync.replicas=2</b>'dir." },
    { topic: "1.2 Replikasyon", q: "UnderReplicatedPartitions sürekli alarm veriyor. replica.lag.time.max.ms'i 5 dakikaya çıkarmak neden kötüdür?", opts: ["Geride kalmış replikalar daha uzun süre 'senkron' sayılır; acks=all garantisi zayıflar","Bu ayar yalnızca consumer'ı etkiler","ISR tamamen devre dışı kalır","Broker başlamaz"], a: [0], why: "Alarmı susturur, riski büyütür. Gerçek sebep genelde yavaş disk, doygun ağ, yetersiz <code>num.replica.fetchers</code> ya da GC'dir." },
    { topic: "1.2 Replikasyon", q: "Bir broker restart'ından ~5 dakika sonra liderliklerin kendiliğinden yeniden dağıldığını görüyorsun. Sebep nedir?", opts: ["auto.leader.rebalance.enable=true ve leader.imbalance.check.interval.seconds=300","Consumer group rebalance'ı","ISR genişlemesi lider değiştirir","Controller her 5 dakikada yeniden seçilir"], a: [0], why: "Controller liderliği <i>preferred leader</i>'a (replika listesindeki ilk broker) geri taşır." },
    { topic: "1.3 KRaft", q: "5 controller'lı bir KRaft quorum'u kaç node kaybını tolere eder?", opts: ["2","3","4","1"], a: [0], why: "Çoğunluk 3'tür. Not: 4 voter da yalnızca 2 tolere eder — çift sayı ek maliyet, sıfır ek dayanıklılıktır." },
    { topic: "1.3 KRaft", q: "KRaft'ta broker'lar metadata değişikliklerini nasıl öğrenir?", opts: ["Observer olarak __cluster_metadata log'unu fetch eder ve delta uygularlar","Controller her değişiklikte RPC gönderir","ZooKeeper watch'ları ile","Gossip protokolüyle"], a: [0], why: "Push tabanlı yayılım ZooKeeper dönemine aitti ve büyük cluster'da ölçeklenmiyordu." },
    { topic: "1.4 Retention", q: "Compacted bir topic'in diski sürekli büyüyor. Hangi iki sebep bunu açıklar? (İki doğru cevap — Choose TWO.)", opts: ["Key kardinalitesi çok yüksek; neredeyse her key benzersiz","log.cleaner.dedupe.buffer.size yetersiz","Compaction yalnızca delete ile birlikte çalışır","Tombstone'lar compaction'ı kalıcı olarak durdurur"], a: [0,1], why: "Compaction yalnızca <b>tekrar eden key'leri</b> temizler; benzersiz key'lerde silinecek bir şey yoktur → <code>compact,delete</code> gerekir. Dedupe buffer (128 MiB) yetersizse temizlik yarım kalır." },
    { topic: "1.4 Retention", q: "Bir uygulama 2020 tarihli CreateTime ile veri basmaya başladı ve topic'in segmentleri hızla silindi. Açıklaması nedir?", opts: ["Retention kararı segment zaman damgalarına bakar; CreateTime varsayılan olarak producer'dan gelir","Kafka geçmiş tarihli kayıtları her zaman reddeder","Broker saatiyle uyuşmayan kayıtlar compaction'a girer","message.timestamp.after.max.ms geçmiş kayıtları siler"], a: [0], why: "<code>log.message.timestamp.type</code> varsayılanı <b>CreateTime</b>'dır. 4.0'daki <code>after.max.ms</code> yalnızca <b>gelecek</b> yönünü sınırlar." },
    { topic: "1.5 Tiered storage", q: "Tiered storage hangi topic türünde <b>kullanılamaz</b>?", opts: ["cleanup.policy=compact olanlar","replication.factor=3 olanlar","Çok partition'lı olanlar","acks=all ile yazılanlar"], a: [0], why: "Compaction segmentleri yeniden yazar; uzak depodaki segment değiştirilemez kabul edilir. Bu yüzden <code>__consumer_offsets</code> gibi iç topic'ler de kapsam dışıdır." },

    { topic: "2.1 Batching", q: "Bir ekip <code>producer.send(record).get()</code> kullanıyor ve saniyede 500 mesaj gönderebiliyor. Doğru çözüm nedir?", opts: ["Callback'li asenkron gönderime geçmek; sıra gerekiyorsa idempotence + max.in.flight≤5 zaten yeterlidir","acks=1'e düşmek","batch.size'ı büyütmek","Partition sayısını artırmak"], a: [0], why: "<code>get()</code> her kayıtta broker onayını bekletir ve batch hiç dolmaz. Sıra kaygısı için <code>max.in.flight=1</code> yapmak da gereksizdir (2.2)." },
    { topic: "2.1 Batching", q: "Key kullanan bir topic'te <code>partitioner.ignore.keys=true</code> yapmanın riski nedir?", opts: ["Key olsa bile sticky partitioning uygulanır; aynı key'in sıra garantisi kaybolur","Key'i olmayan kayıtlar reddedilir","Partition sayısı sabitlenir","Sıkıştırma devre dışı kalır"], a: [0], why: "Bu ayar throughput için key tabanlı yönlendirmeyi <b>bilinçli olarak</b> feda eder; yalnızca sıranın önemsiz olduğu yüklerde kullanılır." },
    { topic: "2.2 Idempotence", q: "Idempotence açıkken sıra garantisi için max.in.flight kaç olmalıdır?", opts: ["5'e kadar herhangi bir değer — broker sequence ile sırayı düzeltir","Mutlaka 1","Sınırsız","En az 6"], a: [0], why: "Broker <code>(PID, partition)</code> için son 5 batch'in durumunu tutar. \"Sıra için 1 yap\" tavsiyesi <b>3.0 öncesine</b> aittir ve throughput'u beşte birine indirir." },
    { topic: "2.2 Idempotence", q: "UnknownProducerIdException ne anlama gelir?", opts: ["Broker o producer'ın durumunu artık tutmuyor (uzun yazım boşluğu / retention)","Producer henüz init edilmemiş","ACL yetersiz","Transaction coordinator bulunamadı"], a: [0], why: "Producer state sonsuza kadar tutulmaz. Bu <b>ölümcül</b> sınıftadır; producer yeniden oluşturulmalıdır." },
    { topic: "2.3 Teslimat", q: "Producer'da hızlı hata almak için doğru ayar hangisidir?", opts: ["delivery.timeout.ms'i düşürmek","retries=0 yapmak","request.timeout.ms'i 1000'e çekip retries'i sınırsız bırakmak","max.block.ms'i 0 yapmak"], a: [0], why: "<code>retries</code> varsayılanı Integer.MAX_VALUE olduğu için anlamsızdır; asıl bütçe <code>delivery.timeout.ms</code>'tir. <code>retries=0</code> ayrıca idempotence ile uyumsuzdur." },
    { topic: "2.3 Teslimat", q: "Producer callback'i hangi thread'de çalışır ve pratik sonucu nedir?", opts: ["Sender thread'inde — içinde bloklayan iş tüm producer'ı durdurur","Yeni bir thread'de","Uygulama thread'inde","Broker tarafında"], a: [0], why: "Callback'e senkron DB yazımı eklemek \"hiçbir ayar değişmedi ama throughput düştü\" vakalarının klasik sebebidir." },
    { topic: "2.3 Teslimat", q: "acks=0 hangi durumda savunulabilir bir seçimdir?", opts: ["Kaybı tolere edilebilen yüksek hacimli telemetri","Finansal işlem kayıtları","Denetim logları","Consumer offset yazımı"], a: [0], why: "<code>acks=0</code> \"bu verinin bir kısmını kaybetmek problem değil\" demektir; ayrıca idempotence ile uyumsuzdur." },
    { topic: "2.4 Şema", q: "message_id olarak <code>topic-partition-offset</code> kullanmak hangi senaryoda kırılır?", opts: ["Topic yeniden oynatıldığında veya MirrorMaker ile kopyalandığında offsetler değişir","Consumer group değiştiğinde","Compaction çalıştığında","Partition sayısı arttığında"], a: [0], why: "Offset <b>fiziksel bir konumdur</b>, işin kimliği değil. Kalıcı tekillik için iş anahtarı ya da producer'ın ürettiği sabit UUID kullanılır." },
    { topic: "2.4 Şema", q: "Toleranslı bir deserializer, bildiğinden daha yeni bir şema sürümüyle karşılaşınca ne yapmalıdır?", opts: ["Tanıdığı alanları okuyup kalan baytları atlamalı","İstisna fırlatmalı","null döndürmeli","Producer'dan eski sürüm istemeli"], a: [0], why: "Bilinmeyen kuyruğu atlamak <b>ileriye dönük uyumluluğun</b> uygulama karşılığıdır. İstisna tüketiciyi kilitler, null veriyi sessizce kaybeder." },

    { topic: "3.1 Fetch/poll", q: "Bir fetch cevabı 50.000 kayıt getirdi ve max.poll.records=500. Sonraki 100 poll için kaç kez ağa çıkılır?", opts: ["Prensipte hiç — kayıtlar tampondan verilir, fetch'ler öngörülü yapılır","100","50.000","500"], a: [0], why: "Consumer tampon tutar ve prefetch yapar; bu yüzden <code>poll()</code> süresi ağ gecikmesinin ölçüsü değildir." },
    { topic: "3.1 Fetch/poll", q: "assign() kullanan bir uygulamanın ikinci instance'ını başlatırsan ne olur?", opts: ["İkisi de aynı partition'ları okur; grup koordinasyonu ve otomatik dağılım yoktur","Partition'lar otomatik bölünür","İkinci instance hata alır","Rebalance tetiklenir"], a: [0], why: "<code>assign()</code> grup koordinasyonunu tamamen atlar; ölçeklenen üretim tüketicileri <code>subscribe()</code> kullanmalıdır." },
    { topic: "3.2 Rebalance", q: "Klasik protokolde partition atamasını kim hesaplar ve bunun dezavantajı nedir?", opts: ["Grup lideri seçilen bir consumer; client sürüm/strateji uyuşmazlığı grubu çökertebilir","Koordinatör broker; ek yük getirir","Cluster controller; failover'ı yavaşlatır","Her consumer kendi payını hesaplar; tutarsızlık olur"], a: [0], why: "KIP-848 atamayı broker'a taşıyarak bu sınıf hataları <b>yapısal olarak</b> ortadan kaldırır." },
    { topic: "3.2 Rebalance", q: "6 partition, 2 consumer çalışırken 3. consumer katıldı ve CooperativeStickyAssignor kullanılıyor. Ne olur?", opts: ["Yalnızca taşınacak partition'lar geri alınır; diğerleri kesintisiz devam eder","Tüm atamalar bırakılıp yeniden dağıtılır","Yeni consumer atıl bekler","Rebalance olmaz"], a: [0], why: "Artımlı (cooperative) rebalance yalnızca gerçekten taşınacakları geri alır; eager assignor'larda tüm grup durur." },
    { topic: "3.2 Rebalance", q: "group.instance.id ile static membership kullanan bir ekip hâlâ restart'ta rebalance yaşıyor. Sebep nedir?", opts: ["Kimlik her açılışta rastgele (UUID) üretiliyor","session.timeout.ms çok yüksek","Static membership yalnızca KIP-848'de çalışır","Kimlik topic adıyla eşleşmeli"], a: [0], why: "Static membership'in tüm fikri <b>kararlı</b> bir kimliktir; pod ordinal'i gibi bir değer gerekir." },
    { topic: "3.3 Offset", q: "commitAsync() neden otomatik retry yapmaz?", opts: ["Geç gelen bir retry, daha yeni bir commit'i eski offset'le ezebilirdi","Asenkron çağrılar retry edilemez","Kafka bunu desteklemiyor","Rebalance tetiklerdi"], a: [0], why: "Offsetin geriye alınması kayıtların yeniden işlenmesine yol açardı. Kritik noktalarda (<code>finally</code>, revoke) <code>commitSync</code> kullanılır." },
    { topic: "3.3 Offset", q: "10 gün kapalı kalan bir tüketici açıldığında tüm veriyi baştan işledi. Açıklaması nedir?", opts: ["offsets.retention.minutes (7 gün) doldu, offsetler silindi ve auto.offset.reset=earliest devreye girdi","Rebalance offsetleri sıfırladı","Compaction offsetleri sildi","Broker restart'ı offsetleri kaybetti"], a: [0], why: "Offset kalmayınca <code>auto.offset.reset</code> devreye girer: <code>earliest</code> baştan, <code>latest</code> ise <b>aradaki veriyi atlayarak</b>." },
    { topic: "3.4 Share group", q: "Share group'ta RELEASE ile REJECT arasındaki fark nedir?", opts: ["RELEASE kaydı yeniden teslim edilebilir kılar; REJECT arşivler, bir daha teslim edilmez","RELEASE siler, REJECT DLQ'ya yazar","RELEASE implicit, REJECT explicit modda kullanılır","Aynı şeydir"], a: [0], why: "Geçici hatada RELEASE, kalıcı bozuklukta REJECT. REJECT geri dönüşü olmayan bir karardır." },
    { topic: "3.4 Share group", q: "İşleme 45 saniye sürüyor ve kayıtlar iş bitmeden başkalarına dağıtılıyor. Hangi ayar sorumludur?", opts: ["group.share.record.lock.duration.ms (30 s, üst sınır 60 s)","group.share.delivery.count.limit","max.poll.interval.ms","session.timeout.ms"], a: [0], why: "Kayıt yalnızca kira süresince \"acquired\" kalır. Çözüm kirayı uzatmak ya da Kafka 4.2'deki <b>RENEW</b> onayını kullanmaktır." },

    { topic: "4.1 Transactions", q: "Lab dump'ında producerEpoch her transaction'da arttı (4→5→6→7). Bu hangi mekanizmadır?", opts: ["TV2 (KIP-890) — zombi producer'ın sonraki transaction'a mesaj sızdırmasını engeller","Leader epoch artışı","Her batch'te epoch artar","Retry sayacı"], a: [0], why: "Transaction Version 2, Kafka 4.0'dan beri varsayılandır ve TV1'deki \"transaction'lar arası sızma\" hatasını kapatır." },
    { topic: "4.1 Transactions", q: "initTransactions() hangi işleri yapar? (İki doğru cevap — Choose TWO.)", opts: ["transactional.id için epoch'u artırıp eski oturumları fence'ler","Yarım kalmış transaction'ları abort eder","Consumer group'a katılır","Topic'leri oluşturur"], a: [0,1], why: "Coordinator'ı bulmak, epoch artırmak ve yarım transaction'ları temizlemek — üçü de restart güvenliğinin parçasıdır." },
    { topic: "4.1 Transactions", q: "EOS'a geçildikten sonra throughput yarıya düştü. En olası sebep nedir?", opts: ["Kayıt başına bir transaction açılıyor; batch başına bir transaction kullanılmalı","read_committed her kaydı iki kez okuyor","Transaction'lar sıkıştırmayı kapatıyor","acks=all zorunlu olduğu için"], a: [0], why: "Her transaction en az iki ek yazma ve bir koordinasyon turu demektir; doğru granülarite poll batch'idir." },
    { topic: "4.2 Outbox", q: "Outbox tablosundaki aggregate_id neden Kafka key'i olarak kullanılır?", opts: ["Aynı toplulaştırmanın olayları aynı partition'a gitsin ve sıraları korunsun","Tekilleştirme için","Relay'in sırasını belirlemek için","Partition sayısını ayarlamak için"], a: [0], why: "Sıra yalnızca partition içinde garanti edilir; outbox'ın sessiz ama kritik ayrıntısıdır." },
    { topic: "4.2 Outbox", q: "Idempotent tüketicide duplicate tespit edildiğinde offset ilerletilmezse ne olur?", opts: ["Tüketici o kayda kilitlenir; aynı duplicate'i sonsuza kadar işlemeye çalışır","Kafka kaydı otomatik atlar","Rebalance tetiklenir","Hiçbir şey"], a: [0], why: "Duplicate <b>işlenmemiş</b> olsa da <b>geçilmiş</b> sayılmalıdır; aksi hâlde ilerleme durur." },

    { topic: "5.1 Tuning", q: "Düşük trafikli, doygun olmayan bir sistemde linger.ms'i 0'dan 50'ye çıkarırsan ne olur?", opts: ["Gecikme yaklaşık 50 ms artar; kuyruk olmadığı için kazanç yoktur","Gecikme yine düşer","Hiçbir şey değişmez","Throughput iki katına çıkar"], a: [0], why: "Batch'lemenin gecikme kazancı <b>kuyruğun erimesinden</b> gelir; kuyruk yoksa linger saf bekleme olarak eklenir." },
    { topic: "5.1 Tuning", q: "Benchmark'ta 500K kayıt/sn alındı ama üretimde 40K. En olası sebep nedir?", opts: ["Benchmark üretimi taklit etmiyor: farklı acks, replication.factor, mesaj boyutu ya da gerçek dışı veri","Üretim cluster'ı bozuk","Benchmark aracı yanlış ölçüyor","Üretimde sıkıştırma kapalı olmalı"], a: [0], why: "Benchmark okurken ilk soru \"hangi koşullarla, hangi veriyle?\" olmalıdır." },
    { topic: "5.2 Metrikler", q: "OfflinePartitionsCount > 0 ne anlama gelir?", opts: ["Bazı partition'ların lideri yok; ne yazılabilir ne okunabilir","Bazı partition'lar ISR eksik ama çalışıyor","Bazı partition'lar boş","Bazı partition'lar compaction bekliyor"], a: [0], why: "En yüksek öncelikli alarmlardandır; genelde ISR boşalıp unclean seçim kapalıyken görülür." },
    { topic: "5.2 Metrikler", q: "RequestHandlerAvgIdlePercent 0.05'e düştü. Ne anlama gelir?", opts: ["İstek işleyici thread'leri doygun; num.io.threads adaydır","Broker boşta","Ağ thread'leri doygun","Disk dolmuş"], a: [0], why: "Idle yüzdesi bir <b>kapasite yastığıdır</b>; sağlıklı kabul edilen eşik 0.3 üzeridir. Ağ tarafının göstergesi <code>NetworkProcessorAvgIdlePercent</code>'tir." },
    { topic: "5.2 Metrikler", q: "Rebalance fırtınasından <b>önce</b> uyarı veren consumer metriği hangisidir?", opts: ["last-poll-seconds-ago","records-consumed-rate","fetch-latency-avg","commit-latency-avg"], a: [0], why: "<code>max.poll.interval.ms</code>'e yaklaşması, üye atılmadan önce görülebilen tek sinyaldir; %70 eşiğinde uyarı kurulur." },
    { topic: "5.3 Arıza", q: "replication.factor=1 bir topic broker varsayılanı min.insync.replicas=2'yi miras aldı. Sonuç nedir?", opts: ["Topic sağlıklıyken bile acks=all ile yazılamaz — kalıcı yapılandırma hatası","Kafka topic'i reddeder","min.insync otomatik 1'e düşer","Yalnızca broker kaybında sorun çıkar"], a: [0], why: "ISR en fazla replication.factor kadar olabilir. Kural: <b>min.insync.replicas &lt; replication.factor</b>." },
    { topic: "5.3 Arıza", q: "Consumer group PreparingRebalance durumunda takılı ve lag artıyor. İlk bakılacak iki şey nedir? (İki doğru cevap — Choose TWO.)", opts: ["max.poll.records × kayıt başına işleme süresi","Pod restart döngüsü / OOMKilled olayları","Topic retention ayarları","Broker num.io.threads değeri"], a: [0,1], why: "Fırtınanın iki klasik sebebi: işleme süresi aşımı ve üyelerin sürekli ölüp doğması." },
    { topic: "5.3 Arıza", q: "Bir broker'ın CPU'su diğerlerinin iki katı ve partition sayıları eşit. İlk kontrol nedir?", opts: ["Partition liderlerinin o broker'da toplanıp toplanmadığı","Disk hızı","Broker eklemek","Retention süresi"], a: [0], why: "Tüm okuma/yazma lidere gider; <code>kafka-leader-election.sh --election-type preferred</code> çoğu zaman yeter. İkinci aday sıcak key'dir." },
    { topic: "5.4 Güvenlik", q: "allow.everyone.if.no.acl.found=true ayarı ne yapar?", opts: ["ACL'i olmayan kaynaklara herkesin erişmesine izin verir","Tüm ACL'leri devre dışı bırakır","Yalnızca süper kullanıcılara izin verir","ACL'siz kaynaklara erişimi engeller"], a: [0], why: "Varsayılan <b>false</b>'tur; geçiş için açılır ve <b>kapatılması unutulur</b> — denetimlerde en sık bulunan açıklardandır." },
    { topic: "5.4 Güvenlik", q: "Transactional bir producer için gereken ACL seti nedir?", opts: ["Topic:Write, Topic:Describe ve TransactionalId:Write","Yalnızca Topic:Write","Cluster:Alter ve Topic:Write","Group:Read ve Topic:Write"], a: [0], why: "Transaction kullanan producer kendi <code>transactional.id</code>'si üzerinde de yetki ister." },
    { topic: "5.5 Kapasite", q: "8.000 mesaj/sn × 500 bayt, sıkıştırma 0,4, replication.factor=3, 10 gün. Yaklaşık disk (pay hariç) nedir?", opts: ["~4,1 TB","~1,4 TB","~12 TB","~350 GB"], a: [0], why: "4 MB/s → günlük 346 GB ham → 138 GB sıkıştırılmış → replication.factor=3 ile 415 GB/gün → 10 gün ≈ 4,1 TB. Üstüne %30 pay eklenir ve disk %75'i geçmemelidir." },

    { topic: "6.1 Topoloji", q: "application.id ayarının Kafka tarafındaki karşılığı nedir?", opts: ["Consumer group id — Streams uygulaması bir consumer group'tur","Client id","Transactional id","Yalnızca topic ön eki"], a: [0], why: "Bu yüzden 3.2'deki tüm rebalance kuralları geçerlidir ve <code>application.id</code> değiştirmek <b>yeni bir grup</b> demektir." },
    { topic: "6.1 Topoloji", q: "Repartition topic'inde retention.ms=-1 görülmesi ne anlama gelir?", opts: ["Zamana bağlı silme yok; Streams işlediği kayıtları kendisi budar","Topic sonsuza kadar büyür","Ayar hatalıdır","Compaction ile yönetilir"], a: [0], why: "Zamana bağlı silme işlenmemiş kayıtları öldürebilirdi. Pratik sonuç: durdurulmuş bir uygulamanın repartition topic'i büyümeye devam eder." },
    { topic: "6.2 State store", q: "Kubernetes'te büyük state'li bir Streams uygulaması için doğru kombinasyon nedir?", opts: ["StatefulSet + PVC (kalıcı disk) + kararlı group.instance.id","Deployment + emptyDir + rastgele instance id","Deployment + emptyDir + standby=0","StatefulSet + emptyDir + otomatik ölçekleme"], a: [0], why: "PVC restore'u ortadan kaldırır, kararlı kimlik rebalance'ı önler, StatefulSet ikisini mümkün kılar." },
    { topic: "6.2 State store", q: "Reset aracını çalıştırdın ama uygulama yine eski durumla açıldı. Ne eksik?", opts: ["Yerel state.dir dizinini de silmek gerekir","application.id değiştirilmeliydi","--execute parametresi eksikti","Broker yeniden başlatılmalıydı"], a: [0], why: "Reset aracı Kafka tarafını temizler; yerel RocksDB dizinine dokunamaz. İki adım her zaman birlikte yapılır." },
    { topic: "6.3 Windowing", q: "Session window çıktısında null value görülmesi ne anlama gelir?", opts: ["Oturumlar birleşti; eski pencere tombstone ile siliniyor","Aggregate hata verdi","Pencere boş kaldı","Serde uyumsuzluğu"], a: [0], why: "Aşağı akış kodun <b>null value'ları ele almalıdır</b>; aksi hâlde NPE alırsın." },
    { topic: "6.3 Windowing", q: "suppress(untilWindowCloses) kullanan bir uygulama düşük trafikli bir topic'te hiç sonuç üretmiyor. Neden?", opts: ["Nihai sonuç stream time pencereyi kapatınca yayılır; veri gelmezse yayılmaz","suppress yalnızca EOS'ta çalışır","Buffer dolmadı","Sonuçlar changelog'a yazılıyor"], a: [0], why: "Seyrek trafikte <code>untilTimeLimit</code> tercih edilmeli ya da suppress hiç kullanılmamalıdır." },
    { topic: "6.3 Windowing", q: "Join yaparken co-partitioning için gereken şartlar hangileridir? (İki doğru cevap — Choose TWO.)", opts: ["İki topic'in partition sayısı aynı olmalı","Aynı partitioning stratejisi ve key tipi kullanılmalı","İki topic aynı broker'da olmalı","Retention süreleri eşit olmalı"], a: [0,1], why: "Aynı key'in iki tarafta da aynı task'a düşmesi gerekir. <b>GlobalKTable</b> bu şartı kaldırır." },
    { topic: "6.4 Streams EOS", q: "Streams'te processing.exception.handler hangi hataları ele alır?", opts: ["Processor kodunda fırlatılan istisnaları (KIP-1033)","Deserialization hatalarını","Çıktı yazma hatalarını","Rebalance hatalarını"], a: [0], why: "Üç katman: <b>okuyamadım</b> (deserialization), <b>işleyemedim</b> (processing), <b>yazamadım</b> (production). Her birinin ayrı handler'ı vardır." },
    { topic: "6.4 Streams EOS", q: "setUncaughtExceptionHandler içinde REPLACE_THREAD döndürmek hangi durumda tehlikelidir?", opts: ["Kalıcı bir hatada — sonsuz thread değiştirme döngüsü oluşur","Geçici ağ hatalarında","Tek instance'lı uygulamalarda","EOS modunda"], a: [0], why: "Hata sınıfına bakarak karar verilmeli ve bir deneme sayacı eklenmelidir; kalıcı hatalarda SHUTDOWN_CLIENT/APPLICATION doğrudur." },
