# Kaynak (source) connector: dosyayı satır satır okuyup topic'e yazar.
name=dosya-kaynak
connector.class=org.apache.kafka.connect.file.FileStreamSourceConnector
tasks.max=1
file=/tmp/kaynak.txt
topic=lab-connect-in

# SMT (Single Message Transform): her kayda bir header ekler
transforms=etiket
transforms.etiket.type=org.apache.kafka.connect.transforms.InsertHeader
transforms.etiket.header=kaynak
transforms.etiket.value.literal=dosya
