# 07 — Kafka Connect standalone worker (lab).
bootstrap.servers=kafka-1:19092

# Converter: baytları Connect'in iç veri modeline çevirir (7.1)
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.storage.StringConverter

# Standalone modda offsetler DOSYADA tutulur (distributed modda Kafka topic'inde)
offset.storage.file.filename=/tmp/connect.offsets
offset.flush.interval.ms=3000

listeners=HTTP://:8084

# ⚠ plugin.path TÜM libs dizinini göstermemeli: tarama dakikalar sürer ve
# classpath ile çakışabilir. Yalnızca gerçek plugin jar'ını/dizinini göster.
plugin.path=/opt/kafka/libs/connect-file-4.3.1.jar
