name: kafkaadv-secure

# 5.4 — Güvenlik labı için AYRI, tek node'lu cluster.
# Ana lab cluster'ına (kafkaadv) dokunmaz; farklı portlarda çalışır.
#
#   Başlat : docker compose -f lab/docker/docker-compose-secure.yml up -d
#   Durdur : docker compose -f lab/docker/docker-compose-secure.yml down -v
#
# Host'tan bağlanma adresi: localhost:39093  (SASL_PLAINTEXT / PLAIN)
# Kullanıcılar: admin (süper kullanıcı) · alice · bob   — parolalar aşağıda

services:
  kafka-sec:
    image: apache/kafka:4.3.1
    hostname: kafka-sec
    container_name: kafka-sec
    ports: [ "39093:9094" ]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      CLUSTER_ID: 'sEcUrEkAfKaLaB0000000w'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'

      # CONTROLLER ve iç iletişim düz metin (lab sadeliği), İSTEMCİ tarafı SASL
      # SASL      → host'tan erişim   (localhost:39093)
      # SASLINT   → container içinden CLI erişimi (kafka-sec:9095)  ← advertised.listeners tuzağı (00.2)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,SASL:SASL_PLAINTEXT,SASLINT:SASL_PLAINTEXT'
      KAFKA_LISTENERS: 'CONTROLLER://:9093,INTERNAL://:9092,SASL://:9094,SASLINT://:9095'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka-sec:9092,SASL://localhost:39093,SASLINT://kafka-sec:9095'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-sec:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'

      # --- SASL/PLAIN kullanıcı tanımları (yalnızca lab için; üretimde SCRAM/OAuth kullan) ---
      KAFKA_SASL_ENABLED_MECHANISMS: 'PLAIN'
      KAFKA_LISTENER_NAME_SASLINT_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required user_admin="admin-secret" user_alice="alice-secret" user_bob="bob-secret";'
      KAFKA_LISTENER_NAME_SASL_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required user_admin="admin-secret" user_alice="alice-secret" user_bob="bob-secret";'

      # --- Yetkilendirme ---
      KAFKA_AUTHORIZER_CLASS_NAME: 'org.apache.kafka.metadata.authorizer.StandardAuthorizer'
      KAFKA_SUPER_USERS: 'User:admin;User:ANONYMOUS'
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: 'false'

      # --- tek node olduğu için ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
