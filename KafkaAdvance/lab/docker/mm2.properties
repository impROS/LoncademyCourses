# 7.2 — MirrorMaker 2: kaynak (ana lab cluster'ı) → hedef (felaket kurtarma cluster'ı)
#
# MM2 ayrı bir uygulama değil, Connect üzerine kurulmuş ÜÇ connector'dır:
#   MirrorSourceConnector      → topic verisi + yapılandırması
#   MirrorCheckpointConnector  → consumer group offsetlerinin ÇEVRİMİ
#   MirrorHeartbeatConnector   → canlılık ölçümü

clusters = kaynak, hedef

kaynak.bootstrap.servers = kafka-1:19092,kafka-2:19092,kafka-3:19092
hedef.bootstrap.servers  = kafka-dr:19092

# Tek yönlü replikasyon: kaynak → hedef
kaynak->hedef.enabled = true
kaynak->hedef.topics = lab-mm-.*
kaynak->hedef.groups = .*

# Offset çevrimi: failover'da tüketiciler kaldığı yerden devam edebilsin
kaynak->hedef.emit.checkpoints.enabled = true
kaynak->hedef.emit.checkpoints.interval.seconds = 5
kaynak->hedef.sync.group.offsets.enabled = true
kaynak->hedef.sync.group.offsets.interval.seconds = 5
# ⚠ Grup listesi varsayılan olarak 10 DAKİKADA bir taranır (refresh.groups.interval.seconds=600).
# Lab'da beklememek için 10 saniyeye çekiyoruz — üretimde varsayılan yeterlidir.
kaynak->hedef.refresh.groups.interval.seconds = 10

# Topic yapılandırmasını da taşı (partition sayısı, retention...)
kaynak->hedef.sync.topic.configs.enabled = true
kaynak->hedef.refresh.topics.interval.seconds = 10

# Hedef tek node olduğu için iç topic'ler RF=1
replication.factor = 1
checkpoints.topic.replication.factor = 1
heartbeats.topic.replication.factor = 1
offset-syncs.topic.replication.factor = 1
offset.storage.replication.factor = 1
status.storage.replication.factor = 1
config.storage.replication.factor = 1

tasks.max = 2
