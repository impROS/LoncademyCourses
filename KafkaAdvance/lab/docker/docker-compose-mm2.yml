name: kafkaadv-dr

# 7.2 — MirrorMaker 2 labı: AYRI bir "felaket kurtarma" cluster'ı + MM2 çalıştırıcısı.
# Ana cluster'a (kafkaadv) dokunmaz, onun ağına bağlanır.
#
#   Önce ana cluster çalışıyor olmalı:
#     docker compose -f lab/docker/docker-compose.yml up -d
#   Sonra:
#     docker compose -f lab/docker/docker-compose-mm2.yml up -d
#
#   Hedef cluster'a host'tan erişim: localhost:59092
#   Durdur: docker compose -f lab/docker/docker-compose-mm2.yml down -v

services:
  # --- Hedef (DR) cluster: tek node KRaft ---
  kafka-dr:
    image: apache/kafka:4.3.1
    hostname: kafka-dr
    container_name: kafka-dr
    ports: [ "59092:9092" ]
    networks: [ kafkaadv_default ]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      CLUSTER_ID: 'drClUsTeRkAfKaLaB00000w'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT'
      KAFKA_LISTENERS: 'CONTROLLER://:9093,INTERNAL://:19092,HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka-dr:19092,HOST://localhost:59092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-dr:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes: [ "dr-data:/var/lib/kafka/data" ]

  # --- MM2 çalıştırıcısı: broker'ın İÇİNDE değil, AYRI konteynerde ---
  mm2:
    image: apache/kafka:4.3.1
    hostname: mm2
    container_name: mm2
    depends_on: [ kafka-dr ]
    networks: [ kafkaadv_default ]
    volumes:
      - ./mm2.properties:/opt/kafka/config/mm2.properties:ro
    command: [ "/opt/kafka/bin/connect-mirror-maker.sh", "/opt/kafka/config/mm2.properties" ]

networks:
  kafkaadv_default:
    external: true

volumes:
  dr-data:
