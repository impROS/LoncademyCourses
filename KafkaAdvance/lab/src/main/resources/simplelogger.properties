# Lab log ayarları — Kafka'nın iç loglarını okunur tut.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showShortLogName=true

# Rebalance / grup protokolü davranışını görmek için (3.2 ve 6.x konularında lazım):
org.slf4j.simpleLogger.log.org.apache.kafka.clients.consumer.internals=info
# Producer'ın batch/retry davranışı (2.1 ve 2.2 konularında lazım):
org.slf4j.simpleLogger.log.org.apache.kafka.clients.producer.internals.Sender=info
