<body>
<script>
window.QUIZ = {
  id: "g9",
  code: "Dilbilgisi · g9",
  title: "Gerund ve infinitive",
  back: "g9-gerund-infinitive.md",
  backLabel: "Konuya dön",
  mode: "practice",
  pass: 80,
  langNote: "Sorular İngilizce, açıklamalar Türkçe.",
  questions: [
    {
      topic: "Edat + V-ing",
      q: "We look forward to ______ from you at your earliest convenience.",
      opts: ["hearing", "hear", "have heard", "be heard"],
      a: [0],
      why: "<b>hearing</b> — <code>look forward to</code> kalıbındaki <code>to</code> mastar işareti değil <i>edattır</i>, bu yüzden V-ing alır. Bu, resmî e-postalarda en sık yapılan hatadır ve Türkçe konuşanların klasik tuzağıdır."
    },
    {
      topic: "Edat + V-ing",
      q: "She's very good ______ difficult clients.",
      opts: ["at handling", "at handle", "to handle", "in handle"],
      a: [0],
      why: "<b>at handling</b> — <code>good at</code> kalıbından sonra edat geldiği için V-ing zorunludur. Her edattan sonra V-ing gelir; bu istisnasız bir kuraldır."
    },
    {
      topic: "to V1 alan fiiller",
      q: "The company ______ to relocate its headquarters next year.",
      opts: ["has decided", "has considered", "has avoided", "has denied"],
      a: [0],
      why: "<b>decide + to V1</b> kalıba uyar. <code>consider</code>, <code>avoid</code> ve <code>deny</code> V-ing alır, bu yüzden <i>to relocate</i> ile birleşemezler."
    },
    {
      topic: "V-ing alan fiiller",
      q: "He denied ______ anything about the missing files.",
      opts: ["knowing", "to know", "know", "to have know"],
      a: [0],
      why: "<b>deny + V-ing</b>. Aynı gruptaki fiiller: admit, suggest, recommend, avoid, risk, imagine. Bu grubu birlikte ezberlemek tek tek ezberlemekten kolaydır."
    },
    {
      topic: "Anlam değiştiren fiiller",
      q: "Which sentence means the person lit a cigarette?",
      opts: ["He stopped to smoke.", "He stopped smoking.", "He gave up smoking.", "He avoided smoking."],
      a: [0],
      why: "<b>stop <i>to</i> do</b> = başka bir şey yapmak için durmak, yani sigara içmek üzere durdu. <code>stop + V-ing</code> ise eylemi bırakmaktır — tam tersi anlam."
    },
    {
      topic: "Anlam değiştiren fiiller",
      q: "Please remember ______ the alarm before you leave tonight.",
      opts: ["to set", "setting", "set", "having set"],
      a: [0],
      why: "<b>to set</b> — ileriye dönük bir görev hatırlatılıyor. <code>remember + V-ing</code> geçmişte yapılmış bir şeyi hatırlamaktır: <i>I remember setting it</i> = kurduğumu hatırlıyorum."
    },
    {
      topic: "Anlam değiştiren fiiller",
      q: "The printer isn't responding. Try ______ it off and on again.",
      opts: ["switching", "to switch", "switch", "to be switched"],
      a: [0],
      why: "<b>try + V-ing</b> = bir çözüm önerisi denemek. <code>try to switch</code> ise düğmeye ulaşmanın zor olduğunu ima ederdi; burada kastedilen bu değil."
    },
    {
      topic: "Anlam değiştiren fiiller",
      q: "We regret ______ you that your application was unsuccessful.",
      opts: ["to inform", "informing", "inform", "having informed"],
      a: [0],
      why: "<b>regret to inform</b> — resmî yazışmada kötü haber verirken kullanılan sabit kalıp. <code>regret informing</code> ise 'bildirdiğime pişmanım' demek olurdu, ki bir kurum bunu yazmaz."
    },
    {
      topic: "need + V-ing",
      q: "The brakes ______ before the car goes back on the road.",
      opts: ["need checking", "need check", "need to check", "needs checking"],
      a: [0],
      why: "<b>need + V-ing</b> edilgen anlam taşır: frenlerin kontrol edilmesi gerekiyor. <code>need to check</code> frenlerin bir şeyi kontrol edeceğini söylerdi. Özne çoğul olduğu için <code>needs</code> de yanlıştır."
    },
    {
      topic: "make / let / have",
      q: "The security guard made us ______ our bags at the entrance.",
      opts: ["leave", "to leave", "leaving", "left"],
      a: [0],
      why: "<b>make sb do</b> — yalın fiil alır, <code>to</code> yoktur. Ama edilgende <code>to</code> geri gelir: <i>We were made <b>to leave</b> our bags</i>. Bu asimetri sınavda özellikle sorulur."
    },
    {
      topic: "be used to",
      q: "After six months in Norway, I still haven't got used to ______ in the dark.",
      opts: ["driving", "drive", "have driven", "be driven"],
      a: [0],
      why: "<b>get used to + V-ing</b> — alışmak. Karıştırılan komşusu <code>used to + V1</code>'dir ve o 'eskiden yapardım' demektir. İkisi arasındaki fark g1'de de geçmişti."
    },
    {
      topic: "Kalıplar",
      q: "Choose the two correct sentences. (Choose TWO.)",
      opts: ["It's no use arguing with him.", "There's no point in complaining now.", "It's no use to argue with him.", "There's no point to complain now."],
      a: [0, 1],
      why: "<code>It's no use + V-ing</code> ve <code>There's no point (in) + V-ing</code> sabit kalıplardır; ikisi de mastar almaz. Aynı ailede <i>it's worth doing</i> ve <i>have difficulty doing</i> vardır."
    },
    {
      topic: "verb + sb + to V1",
      q: "Her supervisor encouraged her ______ for the scholarship.",
      opts: ["to apply", "applying", "apply", "that apply"],
      a: [0],
      why: "<b>encourage + sb + to V1</b>. Aynı kalıptaki fiiller: advise, persuade, remind, warn, invite, allow. Dikkat: <code>suggest</code> bu gruba <i>girmez</i> ve <i>suggest sb to do</i> her zaman hatalıdır (bkz. g7)."
    },
    {
      topic: "would like",
      q: "I'd like ______ the manager about this, please.",
      opts: ["to speak", "speaking", "speak", "to speaking"],
      a: [0],
      why: "<b>would like + to V1</b> — <code>like</code> tek başına iki biçimi de alabilir ama <code>would like</code> daima mastar ister. Bu ayrım sınavda gap-fill sorusuna dönüşür."
    },
    {
      topic: "Amaç bildiren mastar",
      q: "She left the office early ______ her daughter from school.",
      opts: ["to collect", "for collecting", "for collect", "collecting"],
      a: [0],
      why: "<b>to collect</b> — amaç bildiren mastar (<i>in order to</i>'nun kısası). Türkçe konuşanlar burada <code>for + V-ing</code> demeye eğilimlidir, ama <code>for</code> amacı değil işlevi anlatır: <i>a tool for cutting metal</i>."
    },
    {
      topic: "Anlam değiştiren fiiller",
      q: "He apologised, then went on ______ the whole incident in detail.",
      opts: ["to describe", "describing", "describe", "described"],
      a: [0],
      why: "<b>go on + to V1</b> = ardından başka bir şeye geçmek. <code>go on + V-ing</code> aynı işe devam etmek demektir, ki özür diledikten sonra 'özür dilemeye devam etti' anlamı cümleyi bozardı."
    }
  ]
};
</script>
