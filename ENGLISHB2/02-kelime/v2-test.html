window.QUIZ = {

      why: "<b>resit</b> = kalınan sınava yeniden girmek. <code>revise</code> sınava çalışmaktır (İngiliz İngilizcesi), sınava girmek değil — bu ikisi aynı cümlede sık karıştırılır."

    {
      topic: "Eğitim",
      q: "She ______ from Hacettepe with a degree ______ pharmacy.",
      opts: ["graduated / in", "graduated / of", "was graduated / in", "graduated from / on"],
      a: [0],
      why: "<b>graduate from</b> + kurum, <b>a degree in</b> + alan. Türkçedeki 'üniversiteyi bitirmek' nesne aldığı için <i>graduate the university</i> hatası çok yapılır; İngilizcede edat zorunludur."
    },
    {
      topic: "Eğitim",
      q: "He ______ of university in his second year and started his own business.",
      opts: ["dropped out", "fell out", "gave up", "put off"],
      a: [0],
      why: "<b>drop out of</b> = okulu tamamlamadan bırakmak. <code>give up</code> genel bir vazgeçmedir ve resmî eğitim bağlamında bu özel anlamı taşımaz."
    },
    {
      topic: "Teknoloji",
      q: "The billing system is so ______ that no supplier will even maintain it any more.",
      opts: ["obsolete", "outdated", "inefficient", "unavailable"],
      a: [0],
      why: "<b>obsolete</b> = artık kullanılamaz, desteklenmez hâle gelmiş. <code>outdated</code> daha yumuşaktır: eski ama hâlâ çalışabilir. Cümledeki 'kimse bakım yapmıyor' vurgusu daha güçlü kelimeyi gerektirir."
    },
    {
      topic: "Teknoloji",
      q: "Please ______ your work regularly; the server has crashed twice this month.",
      opts: ["back up", "upgrade", "install", "log in"],
      a: [0],
      why: "<b>back up</b> (fiil, iki kelime) = yedeklemek. İsim hâli bitişik yazılır: <i>make a backup</i>. Bu yazım farkı sınavlarda kelime türü sorularında karşına çıkar."
    },
    {
      topic: "Teknoloji",
      q: "Many companies are becoming heavily ______ on a single cloud provider.",
      opts: ["dependent", "dependable", "depending", "independent"],
      a: [0],
      why: "<b>dependent on</b> = bağımlı. <code>dependable</code> ise 'güvenilir' demektir ve tamamen farklı bir anlam taşır — aynı kökten türeyen iki sıfat, iki ayrı kavram."

    {

      why: "<code>addictive</code> bağımlılık <i>yapan</i> şeyi niteler; <code>addicted (to)</code> bağımlı <i>olan</i> kişiyi. Aynı ayrım <i>boring/bored</i>, <i>interesting/interested</i> çiftlerinde de geçerlidir (bkz. v5)."

      opts: ["accessible", "accessing", "accessed", "accession"],
      a: [0],
      why: "<b>accessible</b> = erişilebilir. Word formation sorularında istenen tür, boşluğun cümledeki görevinden anlaşılır: <code>not very ___</code> yapısı bir sıfat bekler."
    },
    {
      topic: "Tartışma dili",
      q: "Remote learning has had a profound impact ______ students' motivation.",
      opts: ["on", "to", "for", "in"],

    },
    {
      topic: "Tartışma dili",

    },
    {
      topic: "Sayılabilirlik",

      a: [0],
      why: "<code>information</code> sayılamaz bir isimdir; sayılmak için <b>pieces of</b> gibi bir ölçü ifadesi gerekir. Aynı grupta <i>advice, research, equipment, furniture, news</i> vardır ve hiçbiri çoğul almaz."
    }
  ]
