window.QUIZ = {

  questions: [
    {

      q: "Out of 200 applicants, only six were ______ for interview.",
      opts: ["shortlisted", "recruited", "promoted", "dismissed"],
      a: [0],
      why: "<b>shortlisted</b> — ön elemeyi geçip kısa listeye alınmak. <code>recruited</code> işe alınmayı, yani sürecin sonunu anlatır; mülakat öncesi aşamada henüz kimse işe alınmamıştır."

    {

      opts: ["applied", "attended", "referred", "recruited"],

      why: "<b>hand in your notice</b> = istifa dilekçesini vermek. <code>lay off</code> işveren tarafından yapılan bir eylemdir ve özne çalışan olduğunda mantıksızdır."
    },
    {

      q: "The board will ______ a decision on the merger next Tuesday.",
      opts: ["make", "do", "take", "give"],
      a: [0],
      why: "<b>make a decision</b> — sabit collocation. Türkçedeki 'karar vermek' <i>give</i> ile çevrilmeye çalışılır ve <i>give a decision</i> hatalı olur. Kanca: <code>make</code> ortaya yeni bir şey çıkarır."

    },
    {

      why: "<code>take responsibility</code> ve <code>meet a deadline</code> doğrudur. Teslim tarihi <i>catch</i> edilmez, <i>meet</i> edilir; staj ise <i>do an internship</i> olarak yapılır."
    },
    {

      q: "The vice-president will ______ the meeting in the director's absence.",
      opts: ["chair", "attend", "hold", "join"],
      a: [0],
      why: "<b>chair a meeting</b> = toplantıya başkanlık etmek. <code>attend</code> sadece katılmaktır ve müdürün yokluğunda birinin devralması fikrini vermez."
    },
    {
      topic: "Çalışma koşulları",

      opts: ["commute", "commuting", "travel", "traffic"],

      why: "<b>rewarding</b> = maddi olmasa da tatmin edici. <code>tedious</code> zaten cümlenin ilk yarısında söylenen tekdüzeliği tekrar ederdi ve <i>but</i> ile kurulan zıtlığı bozardı."

      why: "<b>sensitive</b> = alıngan, kolay incinen. <code>sensible</code> ise 'mantıklı, aklı başında' demektir ve iki kelime sınavların favori tuzağıdır — biri duyguyla, diğeri akılla ilgilidir."
    },
    {
      topic: "Resmî e-posta",

      a: [0],
      why: "İsim bilinmiyorsa <b>Yours faithfully</b>, biliniyorsa <i>Yours sincerely</i>. Bu eşleşme resmî yazışmanın standardıdır ve yazma görevlerinde doğrudan puana etki eder."
    },
    {
      topic: "Resmî e-posta",
      q: "Which sentence is appropriate in a formal application email?",

    },
    {

      a: [0],
      why: "<b>workload</b> = kişinin üstlendiği iş miktarı. <code>workforce</code> bir kurumdaki toplam çalışan sayısıdır ve bireysel yoğunluğu anlatmaz — benzer görünen kelimeler farklı şeyleri adlandırır."
    },
    {
      topic: "İşe alım",
      q: "New staff are on a six-month ______ period before their contract becomes permanent.",
      opts: ["probation", "notice", "vacancy", "recruitment"],
      a: [0],
      why: "<b>probation period</b> = deneme süresi. <code>notice period</code> ise istifa ile ayrılış arasındaki süredir; ikisi de 'period' ile gider ama zaman çizgisinin zıt uçlarındadır."
    }
  ]
};
