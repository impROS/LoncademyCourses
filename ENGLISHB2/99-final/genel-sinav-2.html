    { topic: "g5 Conditionals", q: "If we ______ the contract last spring, we would be operating in three countries by now.", opts: ["had signed", "signed", "have signed", "would sign"], a: [0], why: "Geçmiş koşul, şimdiki sonuç: karma koşul. Sonuç tarafındaki <i>by now</i> ve <code>would be</code> bunu ele veriyor." },
