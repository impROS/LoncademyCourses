  questions: [
    { topic: "g1 Zaman sistemi", q: "I ______ for this company since I finished university.", opts: ["have been working", "am working", "work", "worked"], a: [0], why: "<code>since</code> geçmişten şimdiye uzanan bir çizgi çizer → present perfect (continuous). Present continuous yalnızca şu anı gösterir ve geçmişe uzanamaz." },
    { topic: "g1 Zaman sistemi", q: "When exactly ______ the contract?", opts: ["did you sign", "have you signed", "you signed", "had you signed"], a: [0], why: "<i>When exactly</i> belirli bir geçmiş an sorar; present perfect zamanı belirsiz bıraktığı için <code>when</code> ile kullanılamaz." },
    { topic: "g2 Past perfect", q: "The office was empty; everyone ______ home by five.", opts: ["had gone", "has gone", "went", "was going"], a: [0], why: "<i>by five</i> bir referans nokta çizer ve ondan önce tamamlanmış olayı past perfect anlatır." },
    { topic: "g2 Past perfect", q: "Her hands were covered in flour — she ______ all afternoon.", opts: ["had been baking", "had baked", "was baking", "baked"], a: [0], why: "Görünen iz + süre vurgusu → past perfect continuous. <code>had baked</code> yalnızca sonucu bildirir, unun elindeki izini açıklamaz." },
    { topic: "g3 Gelecek biçimleri", q: "A: The report is due tomorrow. B: Don't worry, I ______ it tonight.", opts: ["'ll finish", "'m finishing", "finish", "will have finished"], a: [0], why: "Karar konuşma anında veriliyor → <code>will</code>. Present continuous önceden ayarlanmış bir düzenleme bildirirdi." },
    { topic: "g3 Gelecek biçimleri", q: "By this time next year, they ______ the tunnel.", opts: ["will have completed", "will complete", "are completing", "will be completing"], a: [0], why: "<code>by + zaman</code> o ana kadar bitmiş olacak işi gösterir → future perfect." },
    { topic: "g4 Modals", q: "The lights are off and the car's gone — they ______ already left.", opts: ["must have", "can't have", "should have", "needn't have"], a: [0], why: "Kanıt güçlü ve olumlu → <code>must have + V3</code>. <code>can't have</code> olumsuz çıkarımdır ve kanıtla çelişir." },
    { topic: "g4 Modals", q: "You ______ have paid for the tickets — they were free for members.", opts: ["needn't", "mustn't", "couldn't", "shouldn't have to"], a: [0], why: "<code>needn't have + V3</code> = gereksiz yere yapılmış iş. Ödeme yapılmış ama gerekmiyormuş." },
    { topic: "g5 Conditionals", q: "If the alarm ______ , we would have evacuated the building.", opts: ["had gone off", "went off", "would go off", "has gone off"], a: [0], why: "Sonuç tarafı <code>would have + V3</code> olduğu için tip 3: koşul tarafı past perfect olmalı." },
    { topic: "g5 Conditionals", q: "If I ______ better at maths, I'd apply for the data analyst role.", opts: ["were", "am", "would be", "had been"], a: [0], why: "Tip 2 hayali durum; <code>were</code> her öznede kullanılabilir ve sınavda tercih edilen biçimdir." },
    { topic: "g5 Conditionals", q: "Take a power bank ______ your phone runs out of battery on the way.", opts: ["in case", "if", "unless", "so that"], a: [0], why: "<code>in case</code> önceden alınan önlemi anlatır; <code>if</code> ise ancak olay gerçekleştikten sonraki tepkiyi bildirir." },
    { topic: "g6 Passive", q: "The results ______ on the noticeboard tomorrow morning.", opts: ["will be posted", "will post", "will be post", "are posting"], a: [0], why: "Edilgen gelecek: <code>will + be + V3</code>. <code>be</code>'yi düşürmek en sık yapılan edilgen hatasıdır." },
    { topic: "g6 Passive", q: "It ______ that the new line will open in 2028.", opts: ["is expected", "expects", "is expecting", "has expected"], a: [0], why: "Kişisel olmayan edilgen: <code>It is expected/believed/said that…</code> haber ve akademik dilin standardıdır." },
    { topic: "g7 Reported speech", q: "\"We must finish by Friday.\" → He said they ______ by Friday.", opts: ["had to finish", "must to finish", "would must finish", "should finish"], a: [0], why: "<code>must</code>'ın geçmiş biçimi yoktur; dolaylı anlatımda <code>had to</code>'ya döner." },
    { topic: "g7 Reported speech", q: "\"How much did it cost?\" → She asked me ______ .", opts: ["how much it had cost", "how much did it cost", "how much had it cost", "how much it did cost"], a: [0], why: "Dolaylı soruda düz cümle sırası kullanılır ve yardımcı <code>did</code> düşer; ters sıra doğrudan soruya aittir." },
    { topic: "g7 Reported speech", q: "She ______ postponing the launch until the tests were finished.", opts: ["suggested", "advised me", "told us", "promised"], a: [0], why: "<code>suggest + V-ing</code> kalıba uyar. <code>advise</code> ve <code>tell</code> nesne + <code>to V1</code> ister, <code>promise</code> ise doğrudan <code>to V1</code> alır." },
    { topic: "g8 Relative clauses", q: "The supplier ______ we placed the order has gone into administration.", opts: ["with whom", "with who", "which", "whose"], a: [0], why: "Edat öne alındığında yalnızca <code>whom</code> ya da <code>which</code> gelir; <code>who</code> edattan sonra kullanılamaz." },
    { topic: "g8 Relative clauses", q: "The candidates ______ passed the written test will be interviewed next week.", opts: ["who", "who they", "which", ", who"], a: [0], why: "Tanımlayıcı clause: virgül yok, grup daraltılıyor. Virgül eklenseydi <i>bütün</i> adayların geçtiği anlamı çıkardı." },
    { topic: "g8 Relative clauses", q: "The documents ______ yesterday have not arrived.", opts: ["sent", "sending", "which sent", "to send"], a: [0], why: "Kısaltılmış edilgen relative clause V3 alır: <i>which were sent → sent</i>." },
    { topic: "g9 Gerund/infinitive", q: "The engine needs ______ before the next inspection.", opts: ["servicing", "to service", "service", "be serviced"], a: [0], why: "<code>need + V-ing</code> edilgen anlam taşır: motorun servise <i>alınması</i> gerekiyor." },
    { topic: "g9 Gerund/infinitive", q: "He denied ______ the confidential file.", opts: ["opening", "to open", "open", "to have open"], a: [0], why: "<code>deny + V-ing</code>. Aynı grup: admit, suggest, recommend, avoid, risk, imagine." },
    { topic: "g9 Gerund/infinitive", q: "Which sentence is INCORRECT?", opts: ["I look forward to meet the team.", "I look forward to meeting the team.", "I'm used to working under pressure.", "They made him apologise."], a: [0], why: "<code>look forward to</code> içindeki <code>to</code> edattır ve V-ing ister. Bu, resmî e-postalarda en sık görülen hatadır." },
    { topic: "g10 Bağlaçlar", q: "______ the delays, the project was delivered within budget.", opts: ["Despite", "Although", "However", "Whereas"], a: [0], why: "Ardından isim öbeği geliyor → <code>despite / in spite of</code>. <code>Although</code> özne+fiil isterdi." },
    { topic: "g10 Bağlaçlar", q: "It was ______ a convincing argument that nobody objected.", opts: ["such", "so", "very", "too"], a: [0], why: "<code>such + a/an + sıfat + isim + that</code>. <code>so</code> yalnızca sıfat ya da zarfla kullanılır." },
    { topic: "g10 Bağlaçlar", q: "Rarely ______ such a well-organised event.", opts: ["have I attended", "I have attended", "did I attended", "I attended"], a: [0], why: "Olumsuz/kısıtlayıcı zarf cümle başına gelince inversion olur: yardımcı fiil özneden önce gelir." },
    { topic: "v1 İş ve kariyer", q: "The department failed to ______ its quarterly targets for the third time.", opts: ["meet", "catch", "reach up", "make"], a: [0], why: "<code>meet a target / a deadline</code> sabit collocation'dır." },
    { topic: "v1 İş ve kariyer", q: "After the merger, sixty employees ______ .", opts: ["were made redundant", "were resigned", "were dismissed for misconduct", "handed in their notice by the company"], a: [0], why: "Birleşme sonrası pozisyonların kalkması <code>made redundant</code>'tır; <code>dismissed for misconduct</code> kişisel kusur ima eder." },
    { topic: "v2 Eğitim/teknoloji", q: "The delay will ______ every department, and its ______ on morale is already visible.", opts: ["affect / effect", "effect / affect", "affect / affect", "effect / effect"], a: [0], why: "<code>affect</code> fiil, <code>effect</code> isim. Kanca: affect = action, effect = end result." },
    { topic: "v2 Eğitim/teknoloji", q: "She ______ from Ege University with a degree ______ chemistry.", opts: ["graduated / in", "graduated / of", "was graduated / in", "graduated / on"], a: [0], why: "<code>graduate from</code> + kurum, <code>a degree in</code> + alan. Edatlar sabittir." },
    { topic: "v2 Eğitim/teknoloji", q: "Our booking software is so ______ that the vendor no longer supports it.", opts: ["obsolete", "outdated", "unavailable", "ineffective"], a: [0], why: "<code>obsolete</code> = artık desteklenmeyen, kullanılamaz hâle gelmiş; <code>outdated</code> daha yumuşaktır." },
    { topic: "v3 Çevre/sağlık", q: "The campaign aims to ______ awareness of food waste, as household waste continues to ______ .", opts: ["raise / rise", "rise / raise", "raise / raise", "rise / rise"], a: [0], why: "<code>raise</code> nesne alır, <code>rise</code> almaz. Bu ikili sınavların değişmez sorusudur." },
    { topic: "v3 Çevre/sağlık", q: "He was ______ with a chronic condition and has been on medication since.", opts: ["diagnosed", "prescribed", "recovered", "treated with"], a: [0], why: "<code>diagnose sb with sth</code>. <code>prescribe</code> ilaçla kullanılır, hastalıkla değil." },

    { topic: "v4 Seyahat/toplum", q: "Three men ______ a petrol station on the ring road last night.", opts: ["robbed", "stole", "burgled from", "thieved"], a: [0], why: "<code>rob</code> yer ya da kişiyi nesne alır; <code>steal</code> çalınan eşyayı alır." },
    { topic: "v5 Phrasal/collocation", q: "The conference was ______ at the last minute because of the strike.", opts: ["called off", "called up", "called for", "called in"], a: [0], why: "<code>call off</code> = cancel. Aynı fiilin diğer edatları tamamen farklı anlamlar üretir." },
    { topic: "v5 Phrasal/collocation", q: "Which sentence is INCORRECT?", opts: ["I'll drop off you at the station.", "I'll drop you off at the station.", "I'll drop your sister off at the station.", "I can't put up with the noise."], a: [0], why: "Nesne zamirse ayrılabilir phrasal verb'ün ortasına girmek zorundadır: <i>drop you off</i>." },
    { topic: "v5 Phrasal/collocation", q: "After the night shift she was absolutely ______ .", opts: ["exhausted", "very exhausted", "quite exhausted", "much exhausted"], a: [0], why: "Mutlak sıfatlar <code>very</code> almaz; <code>absolutely / utterly / completely</code> ile güçlendirilir." },
    { topic: "s1 Reading", q: "Text: 'Sales fell sharply after the price rise.' Which option paraphrases this correctly?", opts: ["There was a significant decline in sales once prices went up.", "Prices fell because sales rose.", "Sales were sharp before the price rise.", "The price rise was caused by falling sales."], a: [0], why: "Doğru şık aynı bilgiyi farklı kelimelerle verir. Diğerleri sebep-sonucu tersine çevirir ya da anlamı bozar." },
    { topic: "s1 Reading", q: "Text: 'Trials took place in Iceland and Spain.' Statement: 'Trials took place in Portugal.' The answer is:", opts: ["Not Given", "False", "True", "Partly true"], a: [0], why: "Metin Portekiz hakkında hiçbir şey söylemiyor. <code>False</code> ancak açık bir çürütme varsa doğru olurdu." },
    { topic: "s2 Listening", q: "Speaker: 'We were going to meet at six, but actually let's make it seven.' What time is the meeting?", opts: ["Seven", "Six", "Six thirty", "Not decided"], a: [0], why: "<code>but actually</code> düzeltme sinyalidir; doğru cevap ikinci söylenen bilgidir." },
    { topic: "s3/s4 Writing", q: "A task says 'Discuss both views and give your own opinion'. A candidate gives only their own opinion. What is the consequence?", opts: ["The content mark is reduced because part of the task is missing.", "Only the accuracy mark falls.", "Nothing, if the language is strong.", "The essay is disqualified."], a: [0], why: "Görev maddelerinden biri eksikse içerik puanı tavanlanır; dil kalitesi bunu telafi etmez." },
    { topic: "s1 Reading", q: "Text: 'Although the pilot scheme was popular with staff, it was quietly dropped after a year.' Which statement is best supported?", opts: ["Staff liked the scheme, but it did not continue.", "The scheme was unpopular and expensive.", "Staff asked for the scheme to be dropped.", "The scheme is still running today."], a: [0], why: "Metin iki bilgiyi birden veriyor: beğeni <b>ve</b> sona erdirilmesi. Yalnızca bir yarısını alan şıklar 'doğru ama eksik' tuzağıdır." },
    { topic: "s1 Reading", q: "What is the correct order of steps when reading under time pressure?", opts: ["Skim the text, read the questions, scan, then read closely", "Read closely from start to finish, then answer", "Answer from memory, then check the text", "Look up unknown words, then read the questions"], a: [0], why: "Skim metnin haritasını çıkarır; soru okunmadan yapılan detaylı okuma süreyi bitirir ve okunanın çoğu sorulmaz." },

    { topic: "s3 Writing essay", q: "In the PEEL paragraph structure, which step do candidates most often omit?", opts: ["Explain — saying why the evidence matters", "Point — the topic sentence", "Evidence — an example or reason", "Link — the transition to the next paragraph"], a: [0], why: "Kanıtı verip neden önemli olduğunu söylememek paragrafı yarım bırakır; örgütlenme puanı en çok burada düşer." },

    { topic: "s4 Writing diğer", q: "Which sentence has the right tone for a letter of complaint?", opts: ["I was extremely disappointed to find that the room had not been cleaned.", "This is a disgrace and I am furious.", "I guess these things happen.", "Your staff never do anything properly."], a: [0], why: "Şikâyette doğru ton kararlı ama naziktir; öfkeli ton kayıt hatasıdır ve puan kaybettirir." },
    { topic: "s5 Speaking", q: "Your partner in the collaborative task has said very little. What should you do?", opts: ["Invite them in: 'What's your take on that?'", "Keep talking to fill the silence", "Wait silently until they speak", "Finish the task early on your own"], a: [0], why: "İşbirlikçi görevde etkileşim ayrı bir ölçüttür; partneri dahil etmek puan getirir, tek başına konuşmak düşürür." }
