<script>
window.QUIZ = {
  id: "re-final-1",
  code: "RE-LX64 · Genel Deneme Sınavı 1",
  title: "Genel Sınav 1 — Tüm Konular",
  back: "01-son-tekrar.md",
  backLabel: "Son tekrara dön",
  mode: "exam",
  pass: 80,
  time: 3600,
  passNote: "hedef %80; altındaysan zayıf konu koduna dön",
  questions: [
    { topic: "1.1 Sayılar", q: "Bir GDB oturumunda <code>x/xg $rsp</code> çıktısı <code>0x00000000deadbeef</code>. Bu değerin en düşük değerli byte'ı bellekte hangi adreste durur (x86-64)?", opts: ["En düşük adreste (little-endian)", "En yüksek adreste", "Ortada", "Belirsiz"], a: [0], why: "x86-64 <b>little-endian</b>: en düşük değerli byte en düşük adreste. Byte byte dökümde <code>ef be ad de 00...</code> görürsün." },
    { topic: "1.2 Bellek", q: "Bir fonksiyon prologue'unda <code>sub rsp, 0x40</code> var. Program bu fonksiyonda ne yapmış oldu?", opts: ["Stack'i büyüterek 64 byte yerel değişken alanı açtı", "Stack'ten 64 byte sildi", "64. fonksiyona atladı", "rsp'yi 0x40 yaptı"], a: [0], why: "rsp'yi azaltmak stack'i büyütür (aşağı büyür). <code>0x40=64</code> byte yerel alan. Prologue'un klasik adımı." },
    { topic: "1.3 Derleme/ELF", q: "<code>file crackme</code> çıktısı: 'ELF 64-bit LSB executable, statically linked, stripped'. Analiz açısından en çok hangi zorlukla karşılaşırsın?", opts: ["libc fonksiyonları isimsiz olarak binary'ye gömülü; kendi sembollerin de yok", "Program çalışmaz", "Sadece 32-bit araç gerekir", "String'ler şifrelidir"], a: [0], why: "Statik + stripped: hem senin fonksiyon isimlerin hem de libc (strcmp vb.) isimsiz gömülü. Fonksiyonları davranıştan tanımak gerekir." },
    { topic: "1.1 Sayılar", q: "Bir karakter işleme kodunda <code>and al, 0xDF</code> görüyorsun. Bir ASCII küçük harf üzerinde etkisi nedir?", opts: ["Küçük harfi büyük harfe çevirir (0x20 bitini siler)", "Büyük harfi küçük yapar", "Karakteri siler", "Rakama çevirir"], a: [0], why: "Küçük/büyük harf <code>0x20</code> bitiyle ayrılır. <code>and 0xDF</code> o biti temizler → büyük harf (<code>'a'&0xDF='A'</code>). <code>or 0x20</code> tersidir." },
    { topic: "1.2 Bellek", q: "Decompiler'da <code>*(long *)(param_1 + 0x18)</code> ifadesi büyük olasılıkla neyi gösteriyor?", opts: ["param_1'in gösterdiği bir struct'ın 0x18 offset'indeki 8-byte alanı", "18. dizi elemanı", "Bir yerel değişken", "Dönüş adresi"], a: [0], why: "İndeks/ölçek yok, sabit offset + pointer → <b>struct alanı</b>. <code>long</code> = 8 byte. param_1 struct başı, +0x18 bir alan." },
    { topic: "1.3 Derleme/ELF", q: "Bir binary'de section header'lar silinmiş ama program hâlâ çalışıyor. Bunun sebebi nedir?", opts: ["Kernel programı program header'daki segment'lerle yükler; section'lar çalıştırma için gerekmez", "İşletim sistemi section'ları onarır", "Section'lar sadece dekorasyondur", "Bu imkânsızdır"], a: [0], why: "Çalıştırma <b>segment'lerle</b> olur; section'lar (analiz kolaylığı) silinse de (stripped) program çalışır, sadece araçların işi zorlaşır." },
    { topic: "2.1 Register", q: "<code>mov eax, 0xffffffff</code> çalıştıktan sonra <code>rax</code>'in değeri nedir?", opts: ["0x00000000ffffffff (üst 32 bit sıfırlandı)", "0xffffffffffffffff", "0xffffffff00000000", "Değişmez"], a: [0], why: "32-bit register'a yazmak <b>üst 32 biti sıfırlar</b>. Yani rax = 0xffffffff (üst yarısı 0). Bu, sign-extend DEĞİL zero-extend'dir." },
    { topic: "2.2 Bellek/Flag", q: "<code>lea rdi, [rbp-0x30]</code> hemen bir <code>call fgets</code> öncesinde. Ne oluyor?", opts: ["Yerel bir buffer'ın adresi fgets'in 1. argümanı olarak hazırlanıyor", "rbp-0x30 adresindeki veri okunuyor", "Bir çarpma yapılıyor", "Stack temizleniyor"], a: [0], why: "lea adres üretir; buffer adresini rdi'ye (1. argüman) koyuyor. fgets oraya okuyacak. lea'nın klasik 'pointer hazırlama' kullanımı." },
    { topic: "2.3 Kontrol akışı", q: "Bir döngüde sınır kontrolü <code>cmp eax, edx</code> + <code>jb .devam</code> ile yapılıyor. Bu, <code>eax</code> ve <code>edx</code> hakkında ne söyler?", opts: ["İşaretsiz (unsigned) karşılaştırılıyorlar — muhtemelen boyut/indeks", "İşaretli sayılar", "Float değerler", "Pointer'lar olamaz"], a: [0], why: "<code>jb</code> (jump if below) <b>unsigned</b> karşılaştırmadır. İndeks/boyut değerleri tipik olarak unsigned'dır. <code>jl</code> olsaydı signed olurdu." },
    { topic: "2.4 Fonksiyon ABI", q: "<code>call memcpy</code> öncesi <code>rdx</code> register'ında 0x100 değeri var. Bu ne anlama gelir?", opts: ["256 byte kopyalanacak (memcpy'nin 3. argümanı n)", "Hedef adres 0x100", "Kaynak 256 karakter", "Dönüş değeri 256 olacak"], a: [0], why: "memcpy(dst=rdi, src=rsi, n=rdx). <code>rdx=0x100=256</code> → <b>256 byte kopyalanır</b>. Boyut argümanını doğru okumak taşma analizinde önemli." },
    { topic: "2.1 Register", q: "Disassembly'de <code>test rax, rax</code> + <code>je .hata</code> bir <code>call malloc</code>'tan sonra. Ne kontrol ediliyor?", opts: ["malloc NULL (0) döndürdü mü — bellek ayrılamadı mı", "rax çift mi", "malloc'un argümanı sıfır mı", "Program bitti mi"], a: [0], why: "malloc dönüşü rax'te; başarısızlıkta NULL. <code>test rax,rax</code>+<code>je</code> = 'sıfırsa hata'. Dönüş değeri kontrolünün standart kalıbı." },
    { topic: "2.3 Kontrol akışı", q: "Adres 0x1200'de <code>jne 0x11a0</code> (yukarı) var, öncesinde bir sayaç artışı ve <code>cmp</code>. Bu yapı nedir?", opts: ["Bir döngü (geriye atlama + sayaç + koşul)", "Bir switch", "Bir fonksiyon çağrısı", "Bir if/else"], a: [0], why: "Daha <b>küçük adrese atlama</b> + sayaç + cmp = döngü. İleri atlama olsaydı if/else olurdu. Geri atlama döngünün en güvenilir işaretidir." },
    { topic: "2.2 Bellek/Flag", q: "<code>mov eax, [rdi + rcx*8]</code> hangi veri yapısına erişiyor olabilir?", opts: ["8 byte'lık elemanlardan oluşan bir dizi (pointer/long dizisi)", "char dizisi", "2 byte short dizisi", "Yerel int"], a: [0], why: "Ölçek <code>*8</code> = 8 byte eleman = pointer/long. rdi taban, rcx indeks. <code>*4</code> olsaydı int, <code>*1</code> char olurdu." },
    { topic: "2.4 Fonksiyon ABI", q: "<code>leave</code> komutu bir fonksiyon epilogue'unda ne yapar?", opts: ["mov rsp, rbp ; pop rbp — stack frame'i geri sarar", "Fonksiyondan döner (ret)", "Argümanları temizler", "Yeni frame kurar"], a: [0], why: "<b>leave = mov rsp,rbp; pop rbp.</b> Frame'i toparlar; ardından <code>ret</code> dönüş adresini çeker. leave tek başına dönmez." },
    { topic: "2.3 Kontrol akışı", q: "Kaynakta <code>if (x >= 10)</code> var; assembly'de hangi atlama görülmesi <b>beklenir</b> (ters koşulla)?", opts: ["cmp x,10 + jl (10'dan küçükse gövdeyi atla)", "cmp x,10 + jge", "cmp x,10 + je", "jmp"], a: [0], why: "Derleyici ters koşulla atlar: <code>if(x&gt;=10)</code> → 'x&lt;10 ise gövdeyi atla' = <code>jl</code>. Kaynak koşulunun tersi kullanılır." },
    { topic: "2.1 Register", q: "<code>shl rax, 4</code> matematiksel karşılığı nedir?", opts: ["rax'i 16 ile çarpar (×2⁴)", "rax'i 4 ile çarpar", "rax'i 16'ya böler", "rax'in 4. bitini set eder"], a: [0], why: "Sola kaydırma ×2ⁿ: <code>shl 4</code> = ×16. Derleyici çarpmayı sık sık kaydırmaya çevirir; <code>shr</code> bölmedir." },
    { topic: "2.4 Fonksiyon ABI", q: "Bir <code>call</code>'dan sonra <code>rsi</code>'nin değerinin korunduğunu varsayabilir misin?", opts: ["Hayır; rsi caller-saved'dır, çağrı onu bozmuş olabilir", "Evet, her zaman korunur", "Sadece 32-bit modda korunur", "Sadece rsi bozulur, rdi korunur"], a: [0], why: "Argüman register'ları (<code>rdi,rsi,rdx...</code>) <b>caller-saved</b>: call sonrası bozulabilir. Callee-saved (<code>rbx,rbp,r12-r15</code>) korunur. O yüzden argümanlar yerele kopyalanır." },
    { topic: "3.1 Ghidra", q: "Decompiler bir fonksiyonu <code>iVar1 = FUN_00101229(param_1, param_2);</code> gösteriyor. <code>FUN_00101229</code> nedir?", opts: ["İsimsiz bir fonksiyon (adresinden türetilmiş isim); stripped'te normaldir", "Bir kütüphane makrosu", "Bir hata kodu", "Şifreli bir blok"], a: [0], why: "<b>FUN_&lt;adres&gt;</b> = Ghidra'nın isimsiz fonksiyona verdiği yer tutucu isim. İçini çözüp yeniden adlandırırsın (rename, L)." },
    { topic: "3.2 Decompile okuma", q: "Decompile'da <code>(char)(iVar2 + 0x30)</code> ifadesi ne yapar?", opts: ["Bir sayıyı (0-9) rakam karakterine çevirir (n + '0')", "Karakteri sayıya çevirir", "Büyük harfe çevirir", "48 byte'lık dizi oluşturur"], a: [0], why: "<code>'0'=0x30</code>; sayıya 0x30 <b>eklemek</b> onu rakam karakterine çevirir (7+0x30='7'). Tersi (<code>-0x30</code>) char→int'tir." },
    { topic: "3.3 String/Xref", q: "Bir binary'yi ilk incelerken hangi iki komut en ucuz ilk ipuçlarını verir? <b>(Choose TWO.)</b>", opts: ["strings — gömülü mesajlar/olası flag", "file — mimari, link tipi, stripped durumu", "gcc — binary'yi yeniden derler", "chmod — izinleri değiştirir"], a: [0, 1], why: "<b>strings</b> okunur metinleri, <b>file</b> kimlik bilgisini verir — ikisi de saniyeler sürer ve binary hakkında hızlı fikir sağlar. gcc/chmod analiz komutu değildir." },
    { topic: "3.1 Ghidra", q: "Bir binary UPX ile paketlenmiş. Ghidra'da anlamlı kod yerine küçük bir stub görüyorsun. Gerçek mantığı nasıl görürsün?", opts: ["Programı çalıştırıp kod bellekte açıldıktan sonra dump alarak (dinamik) veya unpack ederek", "Sadece daha çok analyze çalıştırarak", "strings ile", "Ghidra sürümünü yükselterek"], a: [0], why: "Packer gerçek kodu runtime'da açar; <b>statik packed kodu göremez</b>. Çalıştırıp bellekten dump al veya <code>upx -d</code> ile aç." },
    { topic: "3.2 Decompile okuma", q: "Ghidra'da bir değişken <code>undefined8</code> gösteriliyor ve okunması zor. En doğru hamle?", opts: ["Değişkeni doğru tipe retype etmek (Ctrl+L), örn. char* veya long", "Değişkeni silmek", "Görmezden gelmek", "Binary'yi yeniden derlemek"], a: [0], why: "<code>undefined8</code> = Ghidra'nın belirleyemediği 8 byte. <b>Doğru tip</b> vermek (retype) decompile'ı okunur hale getirir; en temel temizlik adımı." },
    { topic: "3.3 String/Xref", q: "Kodda <code>0x9e3779b9</code> sabitini görüyorsun. Hangi algoritma ailesini ima eder?", opts: ["TEA/XXTEA gibi şifreleme (golden ratio delta sabiti)", "MD5", "CRC32", "Base64"], a: [0], why: "<b>0x9e3779b9</b> golden ratio'dan türetilir ve TEA ailesinin delta sabitidir. Tanıdık magic number'lar algoritmayı ele verir; tanımadığını arat." },
    { topic: "3.1 Ghidra", q: "Ghidra'da Listing (assembly) ve Decompiler (C) panelleri arasındaki en önemli çalışma alışkanlığı nedir?", opts: ["İkisi senkronize; şüpheli bir C satırında Listing'e bakıp kesin gerçeği doğrulamak", "Sadece Decompiler'a bakmak", "Sadece Listing'e bakmak", "İkisini asla birlikte açmamak"], a: [0], why: "Decompiler <b>tahmini</b>, Listing <b>kesin</b>. Şüphede senkronize panelde assembly'ye bakıp tahmini doğrularsın — RE'nin temel refleksi." },
    { topic: "3.3 String/Xref", q: "Bir crackme'de 'Access Granted' string'ini kim yazdırdığını bulmanın en hızlı yolu?", opts: ["String'e 'References to' (xref) alıp onu kullanan koda atlamak", "main'i baştan okumak", "Programı defalarca çalıştırmak", "strings çıktısını ezberlemek"], a: [0], why: "<b>Xref (References to)</b> = bu string'i kim kullanıyor → doğrulamanın başarı dalı. Tüm fonksiyonları okumaya göre çok daha hızlı." },
    { topic: "4.1 GDB", q: "PIE bir binary'de Ghidra'nın gösterdiği <code>0x1189</code> adresine <code>break *0x1189</code> koydun ama tutmadı. Sebep ve çözüm?", opts: ["ASLR ile base her çalıştırmada değişir; sembol (break main) veya base+offset kullan", "Adres yanlış yazıldı", "GDB PIE'yi desteklemez", "0x1189 geçersiz"], a: [0], why: "PIE+ASLR: gerçek yükleme tabanı değişir, sabit dosya-offset'i tutmaz. <b>Sembol</b> (<code>break main</code>) veya base+offset (pwndbg <code>$rebase</code>) kullan." },
    { topic: "4.2 Bellek inceleme", q: "Bir bayrak değişkeninin programda <b>nerede</b> 1'e set edildiğini bulmak istiyorsun. En etkili GDB yöntemi?", opts: ["watch flag koyup continue; her değişimde durup bt ile yeri bulmak", "Her satıra breakpoint koymak", "strings'e bakmak", "Programı yeniden derlemek"], a: [0], why: "<b>Watchpoint</b> veriye kurulur: değer değişince otomatik durur. <code>bt</code> ile hangi kodun değiştirdiğini görürsün. Elle adımlamaya göre çok hızlı." },
    { topic: "4.3 Birlikte analiz", q: "Standart bir crackme çözüm akışında 'hipotez' adımının işlevi nedir?", opts: ["Statik gözlemden test edilebilir bir tahmin kurup GDB'de doğrulanacak hedefi belirlemek", "Programı çökertmek", "Rastgele girdi denemek", "Binary'yi patch'lemek"], a: [0], why: "Statikten bir <b>tahmin</b> (örn. 'toplam 0x1a4 olmalı') kurar, dinamikte sınarsın. Hipotezsiz dinamik = körlemesine adımlama; akış bir spiraldir." },
    { topic: "4.1 GDB", q: "Bir <code>call rand</code>'a geldin, içeriğiyle ilgilenmiyorsun. Doğru adımlama komutu?", opts: ["ni (nexti) — çağrının üstünden atla", "si (stepi) — içine gir", "finish", "continue"], a: [0], why: "İlgilenmediğin çağrıyı <b>ni</b> ile atla; <code>si</code> ile girersen libc/rand kodunda kaybolursun. Kendi kodunu si, dış çağrıları ni." },
    { topic: "4.2 Bellek inceleme", q: "<code>x/16xb $rsp</code> ile <code>x/16xg $rsp</code> arasındaki fark nedir?", opts: ["İlki 16 byte, ikincisi 16 qword (128 byte) okur", "İkisi de 16 byte", "İlki string gösterir", "Fark yok"], a: [0], why: "b=1 byte, g=8 byte. 16b=16 byte, 16g=128 byte. Boyut harfini karıştırmak beklediğinden çok/az veri okutur." },
    { topic: "4.3 Birlikte analiz", q: "'Bu string'i kim kullanıyor?' sorusu için hangi araç ve yöntem uygundur?", opts: ["Statik (Ghidra xref) — çalıştırmadan tüm kullanım yerlerini bulur", "Dinamik (GDB adımlama)", "checksec", "file"], a: [0], why: "'Kim kullanıyor' statik bir sorudur; <b>xref</b> tüm referansları çalıştırmadan verir. Dinamik 'şu anki değer' içindir. Doğru soruya doğru araç." },
    { topic: "5.1 Crackme mantık", q: "<code>strings</code>'te parola yok; kodda toplama döngüsü ve <code>cmp eax, 0x1f4</code> var. Tür ve strateji?", opts: ["Dönüşümlü crackme; toplam 0x1f4=500 üreten girdi için keygen yaklaşımı", "Sabit parola; strings ile oku", "Anti-debug; patch'le", "Zaman kısıtı"], a: [0], why: "Girdi işlenip (toplam) hedefle (500) karşılaştırılıyor → <b>dönüşümlü</b>. Toplam tersine çevrilebilir → keygen. Beklenen değer karşılaştırmanın sabit tarafıdır." },
    { topic: "5.2 Keygen", q: "Doğrulama her karakteri <code>c ^ 0x5a</code> yapıp toplamı hedefle karşılaştırıyor. XOR adımının keygen'deki tersi nedir?", opts: ["Yine ^ 0x5a (XOR kendi tersidir)", "- 0x5a", "+ 0x5a", "/ 0x5a"], a: [0], why: "<code>(c^k)^k=c</code>: <b>XOR kendi tersidir</b>. Keygen'de aynı XOR'u uygularsın. Bu yüzden XOR tabanlı doğrulamalar tersine çevirmesi en kolay olanlardır." },
    { topic: "5.3 Patch/anti-debug", q: "Karar <code>test eax,eax; jne .wrong</code>. Programı her girdiyle geçirmek için en temiz patch genelde hangisidir?", opts: ["jne'yi nop'lamak (atlamayı iptal) → akış Correct dalına düşer", "jne'yi je yapmak (koşulu ters çevirir)", "test'i silmek", "eax'i büyütmek"], a: [0], why: "'Yanlışsa atla'yı <b>nop'lamak</b> Wrong'a sapmayı engeller, akış Correct'e akar. <code>jne→je</code> koşulu tersine çevirir (yanlışları geçirir) — dalları oku." },
    { topic: "5.1 Crackme mantık", q: "Bir crackme'de tek bir <code>jne</code>'yi nop'ladın ama hâlâ 'Wrong'. En olası sebep?", opts: ["Birden çok karar noktası var (uzunluk + içerik + checksum); tüm zinciri ele almalısın", "nop çalışmıyor", "Binary şifreli", "strcmp bozuk"], a: [0], why: "Gerçek crackme'ler <b>çoklu kontrol</b> içerir. Tek dalı geçmek yetmez; Ghidra'da tüm karar zincirini (&& çiftleri) bulup her birini ele al." },
    { topic: "5.2 Keygen", q: "Doğrulamada <code>x &amp; 0x0F</code> (alt nibble maskeleme) var. Keygen açısından bu adım için sorun nedir?", opts: ["Üst bitler yok edilir; tersine çevrilemez — o kısmı brute-force veya serbest bırakmak gerekir", "Sorun yok, tersi &amp; 0xF0", "2 kat yavaşlar sadece", "Program çöker"], a: [0], why: "Maskeleme <b>kayıplıdır</b>: silinen bitler geri gelmez. Kayıplı adım belirleyici değilse atlanır; belirleyiciyse o değer brute-force edilir." },
    { topic: "5.3 Patch/anti-debug", q: "Bir crackme GDB altında 'Debugger detected!' verip çıkıyor ama GDB olmadan normal çalışıyor. Bu davranışı en olası açıklaması nedir?", opts: ["ptrace tabanlı anti-debug; kararını patch'leyerek veya GDB'de dönüşünü set ederek atlatırsın", "Binary bozuk", "GDB sürümü eski", "Program her zaman böyle çalışır"], a: [0], why: "GDB altında/dışında <b>farklı davranış</b> klasik anti-debug işaretidir (genelde ptrace). Karar noktasını bulup patch'ler ya da GDB'de <code>set</code> ile sonucu değiştirirsin." },
    { topic: "6.1 Overflow", q: "Bir fonksiyonda <code>char buf[48]; gets(buf);</code> ve buffer <code>rbp-0x30</code>'da. Dönüş adresini ezmek için kaba offset tahmini nedir (cyclic ile teyit edilir)?", opts: ["0x30 + 8 = 56 byte (buffer + kaydedilmiş rbp)", "48 byte", "8 byte", "0x30 - 8 = 40 byte"], a: [0], why: "Buffer başından (rbp-0x30) dönüş adresine (rbp+0x8) = <b>0x30+0x8 = 56</b>. Padding olabileceğinden cyclic ile ölçerek teyit et." },
    { topic: "6.2 pwntools", q: "pwntools ret2win script'inde offset ve win adresi doğru ama program <code>win</code>'e atlayınca movaps'te çöküyor. Çözüm?", opts: ["Fazladan bir 'ret' gadget'ı ekleyerek 16-byte stack hizasını düzeltmek", "Offset'i 16 artırmak", "win adresini değiştirmek", "Binary'yi yeniden derlemek"], a: [0], why: "Bazı libc çağrıları <b>16-byte stack hizası</b> ister; ret2win'de hiza bozulunca movaps çöker. Araya bir <code>ret</code> gadget'ı ekleyip hizala. En sık takılma noktası." },
    { topic: "6.1 Overflow", q: "<code>checksec</code> bir binary için 'Canary: found, PIE: enabled' diyor. Naif ret2win'i zorlaştıran iki koruma nedir? <b>(Choose TWO.)</b>", opts: ["Stack canary — ezilince program abort eder", "PIE — win adresi her çalıştırmada rastgele", "gets fonksiyonunun bulunmaması", "Binary'nin 32-bit olması"], a: [0, 1], why: "<b>Canary</b> naif overflow'u çökertir; <b>PIE</b> sabit win adresini yok eder. İkisi de sızdırma (leak) gerektirir. gets/mimari bu senaryoda engel değil." }
  ]
};
