  questions: [
    { topic: "1.1 Sayılar", q: "<code>mov ecx, 0x2a</code> komutu ondalık kaç değerini yüklüyor?", opts: ["42", "2A", "84", "20"], a: [0], why: "<code>0x2a = 2×16 + 10 = 42</code>. Hex okumayı otomatikleştirmek disassembly okumanın temelidir. (0x2a ayrıca ünlü '42'dir.)" },
    { topic: "1.3 Derleme/ELF", q: "<code>ldd prog</code> çıktısı normal bir kütüphane listesi (libc.so.6 vb.) veriyor. Bu binary hakkında ne söylersin?", opts: ["Dinamik linklenmiş; libc çalışma zamanında ayrı yüklenir", "Statik linklenmiş", "Stripped", "PIE değil"], a: [0], why: "<b>ldd bağımlılık listeliyorsa dinamik</b> linklenmiştir. Statik olsaydı 'not a dynamic executable' derdi. Dinamik binary'lerde libc fonksiyonları isimli görünür." },
    { topic: "1.2 Bellek", q: "Bir yerel değişkene <code>&x</code> ile aldığın adres <code>rbp</code>'den küçük çıkıyor. Bu neyi doğrular?", opts: ["Yerel değişkenlerin rbp'nin altında (rbp-offset) yaşadığını", "Değişkenin global olduğunu", "Değişkenin heap'te olduğunu", "Stack'in yukarı büyüdüğünü"], a: [0], why: "Yereller frame'de <b>rbp-0x…</b> konumundadır (rbp'den küçük adres). Dönüş adresi ve argümanlar rbp+ tarafındadır." },
    { topic: "1.1 Sayılar", q: "Bir işaretsiz karşılaştırmada bir değişken <code>0xFFFFFFFF</code> değerini alıyor. İşaretli (signed) yorumlanırsa değeri kaçtır?", opts: ["−1", "4294967295", "0", "−2147483648"], a: [0], why: "<code>0xFFFFFFFF</code> signed 32-bit = <b>−1</b> (two's complement). Unsigned okunursa 4294967295. Karşılaştırmanın <code>ja</code> mı <code>jg</code> mi olduğu hangi yorumun geçerli olduğunu belirler." },
    { topic: "1.2 Bellek", q: "<code>push rbp</code> çalıştıktan sonra stack ve rsp hakkında ne doğrudur?", opts: ["rsp 8 azaldı ve o adrese rbp yazıldı (stack büyüdü)", "rsp 8 arttı", "rbp değişti", "Stack küçüldü"], a: [0], why: "<b>push = rsp -= 8; [rsp] = deger.</b> Stack aşağı büyür, rsp azalır. pop tersidir. Bu mekanik overflow ve frame okumanın temelidir." },
    { topic: "1.3 Derleme/ELF", q: "Kendi öğrenme binary'ni Ghidra'da en okunur şekilde incelemek için hangi derleme bayrakları en uygundur?", opts: ["-O0 -g (optimizasyon kapalı, debug bilgisi)", "-O3 (agresif optimizasyon)", "-Os -s (boyut optimizasyonu + strip)", "-O2 -flto"], a: [0], why: "<b>-O0</b> kaynağa en yakın, okunur assembly; <b>-g</b> sembol/satır bilgisi ekler. O3/Os/lto ve strip çıktıyı optimize edip okumayı zorlaştırır." },
    { topic: "2.2 Bellek/Flag", q: "<code>test rax, rax</code> + <code>jne .devam</code> kalıbı ne kontrol ediyor?", opts: ["rax sıfır DEĞİLSE .devam'a atla (rax != 0 yolu)", "rax çift mi", "rax ile başka değer eşit mi", "rax negatif mi"], a: [0], why: "<code>test rax,rax</code> ZF'yi rax'in sıfırlığına göre kurar; <code>jne</code> = ZF=0 = rax sıfır <b>değilse</b> atla. Null/sıfır kontrolünün standart kalıbıdır." },
    { topic: "2.1 Register", q: "Bir fonksiyonun dönüş değerini incelemek için <code>call</code>'dan sonra hangi register'a bakarsın?", opts: ["rax (32-bit değer için eax)", "rdi", "rsp", "rbp"], a: [0], why: "System V ABI'de <b>dönüş değeri rax/eax</b>'tedir. call sonrası <code>mov ..., rax</code> veya <code>test rax,rax</code> dönüşle ne yapıldığını gösterir." },
    { topic: "2.3 Kontrol akışı", q: "Art arda iki <code>cmp</code>+<code>jne</code> çifti, ikisi de aynı <code>.wrong</code> etiketine gidiyor. Bu en olası ne?", opts: ["Bir && zinciri: birden çok şartın hepsi sağlanmalı", "Bir switch", "Bir döngü", "İki bağımsız fonksiyon"], a: [0], why: "Aynı hata koluna giden art arda ters-koşullu atlamalar <b>&amp;&amp; zinciridir</b> ('uzunluk doğru VE ilk karakter doğru VE…'). Crackme parola kontrolleri böyle görünür." },
    { topic: "2.4 Fonksiyon ABI", q: "<code>call strcmp</code> öncesi <code>rdi</code> senin girdini, <code>rsi</code> ise sabit bir string'i tutuyor. Bu sana crackme'de ne sağlar?", opts: ["Beklenen parolayı: strcmp'in 2. argümanı (rsi) karşılaştırılan sabittir", "Programın çıkış kodunu", "Stack boyutunu", "Derleyici sürümünü"], a: [0], why: "ABI sırası rdi(1.), rsi(2.). <code>strcmp</code>'in sabit tarafı (rsi) çoğu zaman <b>beklenen paroladır</b>. Bu, en hızlı crackme çözümlerinden biridir." },
    { topic: "2.2 Bellek/Flag", q: "<code>mov byte ptr [rax], 0</code> ifadesindeki <code>byte ptr</code> neyi belirtir?", opts: ["Yazılacak verinin 1 byte olduğunu (immediate için genişlik şart)", "rax'in byte olduğunu", "İşaretli veri", "Sadece dekorasyon"], a: [0], why: "Sabit (<code>0</code>) yazarken kaç byte yazılacağı belirsizdir; <b>byte ptr = 1 byte</b>. word/dword/qword ptr diğer genişlikleri belirtir." },
    { topic: "2.1 Register", q: "<code>xor rdi, rdi</code> bir <code>call exit</code> öncesinde. Ne yapıyor?", opts: ["rdi'yi sıfırlayıp exit'e 0 (başarı) argümanı hazırlıyor", "rdi'yi şifreliyor", "rdi'yi tersine çeviriyor", "Stack'i temizliyor"], a: [0], why: "<code>xor r,r</code> = sıfırlama deyimi. rdi 1. argüman olduğundan <b>exit(0)</b> çağrısı hazırlanıyor. XOR görünce şifreleme sanma; genelde sıfırlama." },
    { topic: "2.3 Kontrol akışı", q: "<code>jmp qword ptr [rax*8 + 0x4030]</code> yapısı en olası neyi gösterir?", opts: ["Bir switch/jump table üzerinden dolaylı atlama", "Bir döngü", "Bir fonksiyon çağrısı", "Bir string kopyalama"], a: [0], why: "İndeksli dolaylı atlama (<code>jmp [tablo + reg*8]</code>) yoğun bir <b>switch'in jump table'ıdır</b>. Seyrek case'lerde derleyici cmp zinciri üretir." },
    { topic: "2.4 Fonksiyon ABI", q: "Bir fonksiyonda <code>push rbp; mov rbp, rsp; sub rsp, 0x20</code> dizisi ne yapar?", opts: ["Prologue: yeni frame kurar ve 32 byte yerel alan açar", "Fonksiyondan döner", "Argümanları yükler", "Bir döngü kurar"], a: [0], why: "Klasik <b>prologue</b>: eski rbp saklanır, yeni frame tabanı kurulur, rsp azaltılarak (<code>0x20=32</code> byte) yerel alan açılır." },
    { topic: "2.1 Register", q: "<code>movsx eax, byte ptr [rsi]</code> ile <code>movzx eax, byte ptr [rsi]</code> arasındaki fark nedir?", opts: ["movsx işaret koruyarak, movzx sıfırla genişletir", "movsx word, movzx byte okur", "İkisi aynıdır", "movsx yazar, movzx okur"], a: [0], why: "<b>movsx = sign-extend</b> (işaret bitini yay), <b>movzx = zero-extend</b> (üstü 0). İşaretli/işaretsiz byte'ı 32-bite genişletirken doğru olan seçilir; değeri değiştirir." },
    { topic: "2.3 Kontrol akışı", q: "<code>je</code> ile <code>jb</code> arasındaki temel fark nedir?", opts: ["je eşitlik (ZF), jb işaretsiz küçüklük (CF) kontrol eder", "İkisi de eşitlik kontrol eder", "je signed, jb signed", "jb eşitlik, je küçüklük"], a: [0], why: "<b>je = ZF (eşit)</b>, <b>jb = CF (below, unsigned küçük)</b>. je eşitlik, jb işaretsiz büyüklük ailesindendir. Farklı flag'lere bakarlar." },
    { topic: "3.1 Ghidra", q: "Ghidra'da bir binary'yi açtın; Symbol Tree → Functions'ta <code>main</code> yok, sadece <code>entry</code> var. En olası sebep ve yaklaşım?", opts: ["Binary stripped; entry'den __libc_start_main'in 1. argümanını takip ederek main'i bul", "Binary bozuk", "main'i yeniden yaz", "Ghidra main'i asla bulamaz"], a: [0], why: "Stripped'te kendi sembollerin yok; <b>entry</b> vardır. <code>__libc_start_main</code>'in ilk argümanı main'in adresidir — oradan takip edersin." },
    { topic: "3.2 Decompile okuma", q: "Decompile'da <code>CONCAT44(0, uVar1)</code> ifadesi görüyorsun. Bu nedir?", opts: ["Ghidra'nın tip belirsizliğinden ürettiği bir yardımcı; gerçek program fonksiyonu değil", "Programın çağırdığı bir libc fonksiyonu", "Bir şifreleme rutini", "Bir sistem çağrısı"], a: [0], why: "<b>CONCAT/SUB</b> byte birleştirme/kesme için Ghidra'nın ürettiği yardımcılardır; doğru tip verince genelde kaybolurlar. Gerçek çağrı sanmak analizi saptırır." },
    { topic: "3.3 String/Xref", q: "Bir binary'nin Imports listesinde <code>ptrace</code> görüyorsun. Ne ima eder?", opts: ["Anti-debug: program izlendiğini tespit etmeye çalışıyor olabilir", "Ağ bağlantısı", "Dosya şifreleme", "Sadece string yazdırma"], a: [0], why: "<code>ptrace</code> process izleme/izlenme tespiti içindir; crackme'lerde klasik <b>anti-debug</b>. Import listesi programın niyetini ele verir." },
    { topic: "3.2 Decompile okuma", q: "Ghidra'da bir fonksiyonu çözerken bulgularını (isim, tip, yorum) kaydetmenin faydası nedir?", opts: ["Proje bunları saklar; ertesi gün aynı binary'ye döndüğünde ilerleme durur", "Binary'yi hızlandırır", "Programı patch'ler", "Kaynak kodu üretir"], a: [0], why: "Ghidra proje-tabanlıdır: <b>rename/retype/yorumlar kaydedilir</b>. Uzun analizlerde ertesi gün sıfırdan başlamazsın. İz bırakmak sürdürülebilirliktir." },
    { topic: "3.1 Ghidra", q: "Disassembler ve decompiler çıktısına güven konusunda doğru olan hangisidir?", opts: ["Disassembler kesin (byte karşılığı); decompiler tahmini, şüpheyle okunmalı", "Decompiler kesin, disassembler tahmini", "İkisi de %100 kaynak üretir", "İkisi de aynı derecede kesindir"], a: [0], why: "<b>Disassembler = kesin</b> (byte→assembly). Decompiler yapı/tip tahmini yapar → hata yapabilir. Şüphede Listing'e (assembly) bakıp doğrularsın." },
    { topic: "3.3 String/Xref", q: "Kodda <code>0x67452301</code> sabitini görüyorsun. Hangi işlemi ima eder?", opts: ["MD5/SHA türü hashing (bilinen init sabiti)", "TEA şifreleme", "Base64 kodlama", "Rastgele dolgu"], a: [0], why: "<b>0x67452301</b> MD5 başlangıç sabitlerinden biridir → hashing ipucu. Tanıdık magic number'lar algoritmayı ele verir." },
    { topic: "4.2 Bellek inceleme", q: "GDB'de <code>x/s &buf</code> komutu ne yapar?", opts: ["buf'un adresindeki string'i okur", "buf'un adresini decimal gösterir", "buf'a string yazar", "buf'u siler"], a: [0], why: "<code>&buf</code> = buf'un adresi; <code>x/s</code> oradaki string'i okur. Girdinin yazıldığı buffer'ın içeriğini görmenin doğrudan yolu." },
    { topic: "4.1 GDB", q: "Bir crackme'de gizli parolayı yakalamak için en pratik dinamik yöntem?", opts: ["break strcmp koyup durunca x/s $rdi ve x/s $rsi ile argümanları okumak", "Programı elle 100 kez denemek", "Binary'yi silmek", "strings ezberlemek"], a: [0], why: "<code>break strcmp</code> karşılaştırma anında durdurur; <b>argüman register'ları</b> karşılaştırılan iki string'i (biri beklenen parola) verir. En hızlı dinamik yol." },
    { topic: "4.3 Birlikte analiz", q: "Bir dönüşümü statikte 20 dakikadır çözemiyorsun. En verimli hamle?", opts: ["GDB'ye geçip girdi vererek gerçek ara değerleri gözlemlemek", "Aynı decompile'ı bir saat daha okumak", "Binary'yi silmek", "Rastgele girdi göndermek"], a: [0], why: "20 dakika kuralı: tek araçta inatlaşma. Karmaşık dönüşüm <b>dinamikte gözle</b> çok daha hızlı çözülür. Hangi sorunun hangi araçla hızlı çözüldüğünü öğren." },
    { topic: "4.1 GDB", q: "<code>set $rax = 0</code> komutu bir kontrolü geçmek için kullanıldığında ne yapmış olursun?", opts: ["Çalışan process'in register'ını değiştirip akışı istediğin dala zorladım (dinamik patch, tek oturum)", "Binary'yi kalıcı değiştirdim", "Yeni breakpoint koydum", "Programı sonlandırdım"], a: [0], why: "<b>set $reg=deger</b> sadece o oturumu etkiler, dosyaya dokunmaz. Kalıcı çözüm için binary patching (5.3) gerekir." },
    { topic: "4.2 Bellek inceleme", q: "Stack dökümünde <code>.text</code> aralığında (kod bölgesi) bir değer görmen tipik olarak neyi gösterir?", opts: ["Bir dönüş adresi (ret buraya dönecek)", "Bir string", "Bir sayaç", "Kaydedilmiş rbp"], a: [0], why: "Kod aralığındaki stack değeri genelde <b>dönüş adresidir</b>. Kaydedilmiş rbp bir stack adresi (0x7fff…) olur; aralıklarından ayırt edersin." },
    { topic: "4.3 Birlikte analiz", q: "Statik ve dinamik analizi tek cümlede en doğru nasıl özetlersin?", opts: ["Statik 'ne yapıyor'u (harita), dinamik 'şu an değeri ne'yi (keşif) cevaplar", "İkisi de aynı bilgiyi verir", "Dinamik her zaman üstündür", "Statik sadece stripped binary'ler içindir"], a: [0], why: "<b>Statik = harita, dinamik = keşif.</b> Statik kapsam (tüm yollar), dinamik kesinlik (gerçek değer) sağlar. İkisi dönüşümlü kullanılır." },
    { topic: "4.1 GDB", q: "PIE bir binary'de güvenilir breakpoint koymak için en doğru yaklaşım?", opts: ["Sembol kullanmak (break main) — base'den bağımsız çalışır", "Sabit dosya-offset'i (break *0x1189)", "Rastgele adres denemek", "Breakpoint koymamak"], a: [0], why: "PIE+ASLR ile sabit adres tutmaz; <b>sembol</b> base'den bağımsızdır. Adres gerekiyorsa base+offset veya pwndbg <code>$rebase</code> kullanılır." },
    { topic: "5.2 Keygen", q: "Doğrulama <code>key[i] = input[i] + i</code> yapıp sonucu sabitle karşılaştırıyorsa keygen ne yapar?", opts: ["input[i] = sabit[i] - i ile her karakteri geri hesaplar", "input[i] = sabit[i] + i", "input'u rastgele üretir", "input[i] = sabit[i] ^ i"], a: [0], why: "Toplamanın tersi çıkarmadır: ileri <code>+i</code> → geri <code>-i</code>. Keygen her adımın tersini uygular; bu tür doğrusal dönüşümler kolayca tersine çevrilir." },
    { topic: "5.1 Crackme mantık", q: "Programı yalnızca <b>bir kez</b> geçmen yeterli. En hızlı yöntem hangisidir?", opts: ["GDB'de set ile register/flag'i o çalıştırmada Correct dalına zorlamak", "Kalıcı binary patch", "Keygen yazmak", "Kaynak kodu bulmak"], a: [0], why: "Tek seferlik geçiş için <b>dinamik set</b> (4.1) en hızlısıdır. Kalıcı çözüm gerekirse patch, üretilebilir key gerekirse keygen." },
    { topic: "5.3 Patch/anti-debug", q: "Kısa <code>jne</code> komutunu <code>je</code>'ye çevirmek için makine kodunda ne yaparsın?", opts: ["0x75 byte'ını 0x74 yaparım (tek byte)", "0x90 byte'ını 0x74 yaparım", "0xCC ekleriz", "İki byte'ı da değiştiririm"], a: [0], why: "<b>jne(kısa)=0x75, je(kısa)=0x74.</b> Tek byte 75→74 koşulu tersine çevirir. Komut uzunluğu korunur (ikisi de 2 byte). nop=0x90, int3=0xCC." },
    { topic: "5.2 Keygen", q: "8 karakterlik bir seri için doğrulama karakterlerin toplamının 640 olmasını istiyor. Geçerli bir seriyi nasıl üretirsin?", opts: ["7 karakteri sabitle, 8.'yi toplamı 640'a tamamlayacak şekilde hesapla", "8 karakteri de brute-force et", "Her karakteri 640/8=80 yap (ve umut et)", "İmkânsız"], a: [0], why: "Toplam <b>doğrusal, tek denklemli</b>; sonsuz çözüm var. 'Hepsini sabitle, birini serbest bırak' tekniğiyle hızlıca bir çözüm üretilir." },
    { topic: "5.1 Crackme mantık", q: "Bir crackme'de saldırı stratejilerinin doğru maliyet sırası hangisidir?", opts: ["Önce oku (gömülü değer) → hesapla (keygen) → zorla (patch)", "Önce patch → oku → hesapla", "Her zaman brute-force", "Her zaman keygen ile başla"], a: [0], why: "Karar ağacı: en ucuz olan <b>okumak</b>; olmuyorsa dönüşümü <b>hesaplamak</b> (keygen); o da zorsa kararı <b>zorlamak</b> (patch). En düşük maliyetten başla." },
    { topic: "6.1 Overflow", q: "Bir programda buffer overflow ile akış ele geçirmek için hangi iki şey doğru olmalıdır? <b>(Choose TWO.)</b>", opts: ["Sınır kontrolü yapmayan bir okuma (gets, scanf(\"%s\")) olmalı", "Taşan veri dönüş adresine ulaşabilmeli (offset yeterli olmalı)", "Binary mutlaka statik linklenmiş olmalı", "Program root ile çalışmalı"], a: [0, 1], why: "Overflow için hem <b>sınırsız yazma</b> hem de taşmanın <b>dönüş adresine ulaşması</b> gerekir. Link tipi ve root ayrıcalığı bu temel mekanizma için şart değildir." },
    { topic: "6.2 pwntools", q: "pwntools ret2win script'inde offset göndermeden önce <code>p.recvuntil(b'Input: ')</code> neden yazılır?", opts: ["Programın prompt'unu bekleyip zamanlamayı senkronlamak için", "Payload'ı şifrelemek için", "Binary'yi yüklemek için", "Gereksizdir"], a: [0], why: "<b>recvuntil</b> programın prompt'una kadar okur; payload'ı doğru anda gönderirsin. Atlanırsa payload prompt'tan önce gidip zamanlama hatası olabilir." },
    { topic: "6.1 Overflow", q: "Offset'i (buffer başından dönüş adresine mesafe) en güvenilir nasıl ölçersin?", opts: ["Cyclic pattern gönderip çökme sonrası rip'teki değeri cyclic -l ile offset'e çevirerek", "Buffer boyutunu tahmin ederek", "Rastgele deneyerek", "Kaynak koda bakıp buffer boyutunu offset kabul ederek"], a: [0], why: "<b>Cyclic pattern</b> en güvenilir yöntemdir: padding ve kaydedilmiş rbp'yi otomatik hesaba katar. 'Buffer boyutu = offset' tahmini yanlıştır." },
    { topic: "6.2 pwntools", q: "pwntools'ta bir adresi payload'a doğru (little-endian, 8 byte) yazmak için ne kullanılır?", opts: ["p64(adres)", "u64(adres)", "hex(adres)", "str(adres)"], a: [0], why: "<b>p64 = pack 64-bit little-endian.</b> Adresi doğru byte sırasında paketler. u64 tersidir (byte→sayı, sızdırma okurken kullanılır)." },
    { topic: "3.1 Ghidra", q: "Bir crackme'yi Ghidra'da çözerken en verimli genel akış hangisidir?", opts: ["Analyze → main/entry bul → ilginç string'e xref → doğrulama fonksiyonunu decompile'da oku", "Tüm fonksiyonları alfabetik sırayla oku", "Sadece hex görünümüne bak", "Programı binlerce kez çalıştır"], a: [0], why: "Verimli akış: <b>analyze → yön bul (string/xref) → doğrulama fonksiyonunu oku</b>. İlginç kod küçüktür; xref seni doğrudan oraya götürür (3.3)." }
  ]
};
